<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投稿活動 | Taiwan News Map</title><style>body{font:16px system-ui;max-width:720px;margin:32px auto;padding:0 18px;background:#0b1020;color:#e5e7eb}form{display:grid;gap:12px}input,textarea,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #475569;background:#121a2d;color:inherit}textarea{min-height:120px}button{background:#075985;border-color:#0284c7;cursor:pointer}.hint,#result{color:#94a3b8;font-size:.9rem}</style></head><body>
<h1>投稿活動資訊</h1><p class="hint">投稿會先經自動檢查，再由管理員覆核；未核准前不會公開。</p>
<form id="form"><input name="title" required minlength="4" maxlength="160" placeholder="活動名稱"><textarea name="description" required minlength="10" maxlength="2000" placeholder="活動內容、時間與必要資訊"></textarea><select name="category" required><option value="activity">活動</option><option value="traffic">交通</option><option value="construction">施工</option><option value="disaster">災害</option><option value="social">社會</option><option value="other">其他</option></select><input name="address" maxlength="240" placeholder="地址／場地"><input name="eventStartTime" type="datetime-local"><input name="sourceUrl" type="url" placeholder="來源網址（選填）"><input name="evidenceUrl" type="url" placeholder="佐證網址（選填）"><button>送出投稿</button></form><p id="result"></p>
<script>const f=document.querySelector('#form'),r=document.querySelector('#result');f.addEventListener('submit',async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(f));d.evidenceUrls=d.evidenceUrl?[d.evidenceUrl]:[];delete d.evidenceUrl;r.textContent='送出中…';try{const x=await fetch('/api/submissions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await x.json();if(!x.ok)throw Error(j.error||'送出失敗');r.textContent='已收到投稿，正在等待審核。編號：'+j.submissionId;f.reset()}catch(err){r.textContent=err.message}})</script>
</body></html>
