<body><h1>提供新聞線索</h1><p class="hint">發現尚未出現在地圖上的重要事件？你可以提供新聞報導、官方公告或現場資訊。線索會先經過檢查與管理員確認，不會直接顯示在公開地圖。</p><p class="standard">僅接受可能影響多人、公共安全、交通、災害或當地生活的重要事件。個人遭遇、鄰里糾紛、小型活動與一般生活瑣事不會收錄。</p>
<form id="form" novalidate><select name="sourceType" required><option value="">請選擇線索來源</option><option value="news_report">新聞報導</option><option value="official_notice">官方公告</option><option value="eyewitness">現場目擊</option></select><input name="title" required minlength="4" maxlength="160" placeholder="事件標題"><textarea name="description" required minlength="10" maxlength="2000" placeholder="請說明事件、影響範圍與你知道的資訊"></textarea><select name="category" required><option value="">請選擇事件分類</option><option value="traffic">重大交通事故或道路中斷</option><option value="disaster">災害或緊急事件</option><option value="police">公共安全事件</option><option value="public_facility">大範圍公共設施異常</option><option value="activity">大型活動或交通管制</option><option value="other">其他具公共影響的事件</option></select><p class="hint">選擇「其他」時，事件仍必須具有公共影響。</p><input name="address" maxlength="240" placeholder="地址或地標（選填）"><input name="latitude" id="latitude" type="hidden"><input name="longitude" id="longitude" type="hidden"><section class="location-panel"><strong>事件位置</strong><p class="hint">現場目擊必須提供有效座標。可在地圖點選或使用目前位置。</p><div class="location-actions"><button type="button" id="use-location">使用目前位置</button><button type="button" id="clear-location">清除位置</button></div><div id="location-status" aria-live="polite">尚未設定位置</div><div id="location-map" class="map-picker" aria-label="選擇事件位置"></div></section><input name="eventStartTime" type="datetime-local" aria-label="事件開始時間"><input name="sourceUrl" type="url" placeholder="新聞報導或官方公告網址"><input name="evidenceUrl" type="url" placeholder="現場圖片或其他證據網址（選填）"><label class="check"><input name="publicImpactConfirmed" type="checkbox" required>我確認這不是個人瑣事，且可能影響多人、公共安全、交通或當地生活。</label><button id="submit-button">提供新聞線索</button></form><p id="result" aria-live="polite"></p>
<script src="/api/config.js"></script><script src="https://api.mapbox.com/mapbox-gl-js/v3.12.0/mapbox-gl.js"></script><script type="module">import{buildSubmissionPayload,getSubmissionResult,validateSubmissionPayload}from"/assets/submit-event.mjs";import{getMapboxToken}from"/assets/index/modules/map.mjs";import{LocationPicker}from"/assets/location-picker.mjs";const form=document.querySelector("#form"),result=document.querySelector("#result"),locationStatus=document.querySelector("#location-status"),submitButton=document.querySelector("#submit-button");let coordinates=null;const showError=(m)=>{result.className="error";result.textContent=m};const token=window.MAPBOX_ACCESS_TOKEN||getMapboxToken();if(window.mapboxgl&&token)new LocationPicker({container:"location-map",latInput:document.querySelector("#latitude"),lngInput:document.querySelector("#longitude"),status:locationStatus,mapboxToken:token,onChange:p=>coordinates={latitude:p.lat,longitude:p.lng}});else locationStatus.textContent="地圖暫時無法載入；仍可填寫地址。";document.querySelector("#use-location").onclick=()=>{if(!navigator.geolocation)return showError("此裝置不支援定位。");navigator.geolocation.getCurrentPosition(p=>{coordinates={latitude:p.coords.latitude,longitude:p.coords.longitude};document.querySelector("#latitude").value=coordinates.latitude;document.querySelector("#longitude").value=coordinates.longitude;locationStatus.textContent=`已設定位置：${coordinates.latitude.toFixed(6)}, ${coordinates.longitude.toFixed(6)}`},()=>showError("無法取得目前位置，請在地圖上點選位置。"),{enableHighAccuracy:true,timeout:10000})};document.querySelector("#clear-location").onclick=()=>{coordinates=null;document.querySelector("#latitude").value="";document.querySelector("#longitude").value="";locationStatus.textContent="尚未設定位置"};form.onsubmit=async e=>{e.preventDefault();const payload=buildSubmissionPayload(new FormData(form),coordinates),errors=validateSubmissionPayload(payload);if(errors.length)return showError(errors[0]);result.className="";result.textContent="正在送出新聞線索…";submitButton.disabled=true;try{const r=await fetch("/api/submissions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)}),data=await r.json();if(!r.ok)throw Error(data.error||"線索送出失敗");result.className="success";result.textContent=getSubmissionResult(data).message;form.reset();coordinates=null;locationStatus.textContent="尚未設定位置"}catch(error){showError(error.message||"線索送出失敗，請稍後再試。")}finally{submitButton.disabled=false}};</script></body></html>
