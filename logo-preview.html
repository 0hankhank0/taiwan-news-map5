<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Island Pulse Logo Preview</title>
  <style>
    :root {
      --preview-size: 120px;
      --frame-size: 220px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, rgba(18, 31, 58, 0.55), transparent 50%),
        linear-gradient(180deg, #0e1424 0%, #09101d 100%);
      font-family: Arial, sans-serif;
    }

    .preview-card {
      width: var(--frame-size);
      height: var(--frame-size);
      display: grid;
      place-items: center;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.03);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 24px 60px rgba(0, 0, 0, 0.35);
    }

    img {
      width: var(--preview-size);
      height: var(--preview-size);
      display: block;
      image-rendering: auto;
    }
  </style>
</head>
<body>
  <div class="preview-card">
    <img id="brand-preview" src="./brand-mark.svg" alt="Island Pulse brand mark">
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const size = Number(params.get("size")) || 120;
    const frame = Math.max(140, size + 80);
    document.documentElement.style.setProperty("--preview-size", `${size}px`);
    document.documentElement.style.setProperty("--frame-size", `${frame}px`);
  </script>
</body>
</html>
