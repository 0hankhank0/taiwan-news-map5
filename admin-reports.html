<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>事件回報後台 | Island Pulse</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --panel: #121a2d;
      --panel-2: #18223a;
      --line: rgba(148, 163, 184, 0.24);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --danger: #fb7185;
      --ok: #34d399;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.5;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 2;
      background: rgba(11, 16, 32, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 20px; }
    h1 { margin: 0 0 4px; font-size: 22px; }
    .sub { margin: 0; color: var(--muted); font-size: 13px; }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 180px 120px;
      gap: 10px;
      margin-top: 16px;
    }
    input, select, textarea, button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }
    input, select, textarea { width: 100%; padding: 10px 12px; }
    textarea { min-height: 76px; resize: vertical; }
    button {
      cursor: pointer;
      padding: 10px 12px;
      font-weight: 700;
    }
    button:hover { border-color: rgba(56, 189, 248, 0.7); }
    button.primary { background: #075985; border-color: #0284c7; }
    button.ok { background: rgba(16, 185, 129, 0.18); border-color: rgba(52, 211, 153, 0.5); }
    button.danger { background: rgba(244, 63, 94, 0.16); border-color: rgba(251, 113, 133, 0.5); }
    button.resolve { background: rgba(251, 191, 36, 0.16); border-color: rgba(251, 191, 36, 0.5); }
    main.wrap { padding-top: 18px; }
    .status-line { color: var(--muted); margin-bottom: 12px; font-size: 13px; }
    .report {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
    }
    .report-head {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: start;
    }
    .title { margin: 0 0 8px; font-size: 17px; }
    .meta, .snapshot, .ai {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0;
    }
    .tag {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .tag.ai-valid, .tag.ai-likely_valid { color: var(--ok); border-color: rgba(52, 211, 153, 0.5); }
    .tag.ai-unclear { color: var(--warn); border-color: rgba(251, 191, 36, 0.5); }
    .tag.ai-likely_invalid, .tag.ai-spam { color: var(--danger); border-color: rgba(251, 113, 133, 0.5); }
    .message, .summary {
      margin: 10px 0;
      padding: 10px 12px;
      background: var(--panel-2);
      border-radius: 8px;
      white-space: pre-wrap;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 8px;
      margin-top: 12px;
      align-items: start;
    }
    a { color: var(--accent); }
    .nav { display:none; }
    .admin-nav { display:flex; gap:8px; margin:14px 0; flex-wrap:wrap; font-size:13px; }
    .admin-nav a { color:var(--accent); text-decoration:none; border:1px solid var(--line); border-radius:8px; padding:8px 10px; }
    .admin-nav a.active { color:var(--text); background:#075985; border-color:#0284c7; font-weight:700; }
    .empty {
      border: 1px dashed var(--line);
      color: var(--muted);
      padding: 32px;
      border-radius: 8px;
      text-align: center;
    }
    @media (max-width: 760px) {
      .toolbar, .report-head, .actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>事件回報後台</h1>
      <p class="sub">AI 只提供審核建議；事件資料需人工覆核後再處理。</p>
      <div class="nav">
        <a href="/admin-events.html">事件管理</a>
        <a href="/admin-health.html">監控頁</a>
        <a href="/">回地圖</a>
      </div>
      <nav class="admin-nav" aria-label="管理後台導覽">
        <a href="/admin-events.html">事件管理</a><a href="/admin-submissions.html">投稿審核</a><a href="/admin-action-log.html">操作紀錄</a><a class="active" href="/admin-reports.html" aria-current="page">資料回報</a><a href="/admin-health.html">系統監控</a><a href="/">回到地圖</a>
      </nav>
      <div class="toolbar">
        <input id="token" type="password" placeholder="REPORT_ADMIN_TOKEN" autocomplete="off" />
        <select id="status">
          <option value="">全部狀態</option>
          <option value="new">new</option>
          <option value="ai_reviewed">ai_reviewed</option>
          <option value="accepted">accepted</option>
          <option value="rejected">rejected</option>
          <option value="resolved">resolved</option>
        </select>
        <button id="load" class="primary" type="button">載入</button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div id="statusLine" class="status-line">尚未載入。</div>
    <section id="reports"></section>
  </main>
  <script>
    const tokenEl = document.getElementById("token");
    const statusEl = document.getElementById("status");
    const reportsEl = document.getElementById("reports");
    const statusLineEl = document.getElementById("statusLine");
    tokenEl.value = localStorage.getItem("report_admin_token") || "";

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#039;"
      }[ch]));
    }

    function formatDate(value) {
      const date = new Date(value || "");
      if (Number.isNaN(date.getTime())) return "";
      return date.toLocaleString("zh-TW", { hour12: false });
    }

    function sourceLink(report) {
      const url = report.eventSnapshot?.sourceUrl || report.eventSnapshot?.url || "";
      if (!url) return "";
      return `<a href="${escapeHtml(url)}" target="_blank" rel="noreferrer">原始來源</a>`;
    }

    function renderReport(report) {
      const ai = report.aiReview || {};
      const snap = report.eventSnapshot || {};
      const note = report.adminNote || "";
      return `
        <article class="report" data-report-id="${escapeHtml(report.reportId)}">
          <div class="report-head">
            <div>
              <h2 class="title">${escapeHtml(report.title)}</h2>
              <div class="meta">
                <span class="tag">#${escapeHtml(report.reportId)}</span>
                <span class="tag">event ${escapeHtml(report.eventId)}</span>
                <span class="tag">status ${escapeHtml(report.status)}</span>
                <span class="tag">${escapeHtml(report.errorType)}</span>
                <span class="tag">${escapeHtml(formatDate(report.createdAt))}</span>
                ${report.validReportCount ? `<span class="tag">同事件有效回報 ${escapeHtml(report.validReportCount)}</span>` : ""}
              </div>
            </div>
            <div>${sourceLink(report)}</div>
          </div>
          <div class="message">${escapeHtml(report.message)}</div>
          <div class="ai">
            <span class="tag ai-${escapeHtml(ai.status || "unclear")}">AI ${escapeHtml(ai.status || "unclear")}</span>
            <span class="tag">confidence ${Math.round(Number(ai.confidence || 0) * 100)}%</span>
            <span class="tag">${escapeHtml(ai.suggestedAction || "needs_human_review")}</span>
          </div>
          <div class="summary">${escapeHtml(ai.summary || "AI 未啟用或尚未回傳。")}</div>
          <div class="snapshot">
            <span class="tag">${escapeHtml(snap.city || "未知城市")}</span>
            <span class="tag">${escapeHtml(snap.category || "未知分類")}</span>
            <span class="tag">lat ${escapeHtml(snap.lat ?? "")}</span>
            <span class="tag">lng ${escapeHtml(snap.lng ?? "")}</span>
          </div>
          <div class="actions">
            <textarea data-note placeholder="人工備註">${escapeHtml(note)}</textarea>
            <button class="ok" type="button" data-update="accepted">accepted</button>
            <button class="danger" type="button" data-update="rejected">rejected</button>
            <button class="resolve" type="button" data-update="resolved">resolved</button>
          </div>
        </article>
      `;
    }

    async function loadReports() {
      const token = tokenEl.value.trim();
      localStorage.setItem("report_admin_token", token);
      const params = new URLSearchParams();
      if (token) params.set("token", token);
      if (statusEl.value) params.set("status", statusEl.value);
      statusLineEl.textContent = "載入中...";
      reportsEl.innerHTML = "";
      try {
        const response = await fetch(`/api/reports?${params.toString()}`, { cache: "no-store" });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
        const reports = Array.isArray(data.reports) ? data.reports : [];
        statusLineEl.textContent = `共 ${data.total || reports.length} 筆，顯示 ${reports.length} 筆。`;
        reportsEl.innerHTML = reports.length ? reports.map(renderReport).join("") : `<div class="empty">目前沒有符合條件的回報。</div>`;
      } catch (error) {
        statusLineEl.textContent = `載入失敗：${error.message}`;
      }
    }

    async function updateReport(card, status) {
      const token = tokenEl.value.trim();
      const reportId = card.dataset.reportId;
      const adminNote = card.querySelector("[data-note]")?.value || "";
      const params = new URLSearchParams({ token, reportId });
      const response = await fetch(`/api/reports?${params.toString()}`, {
        method: "PATCH",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ status, adminNote })
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
      await loadReports();
    }

    document.getElementById("load").addEventListener("click", loadReports);
    statusEl.addEventListener("change", loadReports);
    reportsEl.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-update]");
      if (!button) return;
      const card = button.closest(".report");
      button.disabled = true;
      try {
        await updateReport(card, button.dataset.update);
      } catch (error) {
        alert(`更新失敗：${error.message}`);
      } finally {
        button.disabled = false;
      }
    });

    const initialReportId = new URLSearchParams(location.search).get("reportId");
    if (initialReportId) statusLineEl.textContent = `Discord 連結指定回報：${initialReportId}`;
  </script>
</body>
</html>
