<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>投稿紀錄 | Taiwan News Map</title><style>
:root{color-scheme:dark}body{font:16px system-ui;max-width:1180px;margin:24px auto;padding:0 18px;background:#0b1020;color:#e5e7eb}h1{margin:0}.top,.filters,.pager{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0}input,select,button,a.button{font:inherit;padding:9px;border-radius:7px;border:1px solid #475569;background:#121a2d;color:inherit}button,a.button{cursor:pointer;text-decoration:none}.top a{margin-left:auto}.message{color:#fbbf24;min-height:1.5em}.meta{color:#94a3b8;margin-left:auto}table{width:100%;border-collapse:collapse;background:#10182b;border:1px solid #334155}th,td{padding:11px;vertical-align:top;text-align:left;border-bottom:1px solid #26334a;word-break:break-word}th{color:#cbd5e1;background:#121a2d;white-space:nowrap}.cards{display:none}.card{border:1px solid #334155;border-radius:10px;background:#10182b;padding:13px;margin:10px 0}.card dl{display:grid;grid-template-columns:6.5em 1fr;gap:8px;margin:0}.card dt{color:#94a3b8}.card dd{margin:0;word-break:break-word}.nowrap{white-space:nowrap}@media(max-width:760px){table{display:none}.cards{display:block}.meta{margin-left:0;width:100%}.top a{margin-left:0}.filters input,.filters select{max-width:100%;box-sizing:border-box}.pager{justify-content:space-between}}
</style><style>.admin-nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}.admin-nav a{padding:8px 10px;border:1px solid #475569;border-radius:7px;color:#7dd3fc;text-decoration:none}.admin-nav a.active{color:#e5e7eb;background:#075985;border-color:#0284c7;font-weight:700}</style></head><body>
<nav class="admin-nav" aria-label="管理後台導覽"><a href="/admin-events.html">事件管理</a><a href="/admin-submissions.html">投稿審核</a><a class="active" href="/admin-action-log.html" aria-current="page">投稿紀錄</a><a href="/admin-refresh-log.html">抓取紀錄</a><a href="/admin-reports.html">資料回報</a><a href="/admin-health.html">系統監控</a><a href="/">回到地圖</a></nav>
<div class="top"><h1>投稿操作紀錄</h1><a class="button" href="/admin-submissions.html">返回投稿審核</a></div>
<div class="filters"><input id="token" type="password" autocomplete="off" placeholder="管理員 Token" aria-label="管理員 Token"><button id="load">載入</button><button id="refresh">重新整理</button><select id="action"><option value="">全部操作</option><option value="auto_approve">系統自動核准</option><option value="rules_engine">轉入人工審核</option><option value="admin_approve">管理員核准</option><option value="admin_restore_publish">管理員恢復發布</option><option value="admin_reject">管理員拒絕</option><option value="admin_update">管理員更新狀態</option><option value="report_auto_hide">達檢舉門檻自動隱藏</option><option value="auto_expire">系統自動標記失效</option><option value="update">更新投稿</option></select><input id="submissionId" placeholder="投稿編號" aria-label="投稿編號"><input id="dateFrom" type="date" aria-label="開始日期"><input id="dateTo" type="date" aria-label="結束日期"><button id="clear">清除篩選</button></div>
<p id="message" class="message" role="status"></p><div class="pager"><button id="prev">上一頁</button><button id="next">下一頁</button><span id="meta" class="meta">目前總筆數 0 筆，第 0／0 頁</span></div>
<table><thead><tr><th>操作時間</th><th>操作名稱</th><th>角色</th><th>投稿編號</th><th>原始狀態</th><th>新狀態</th><th>修改欄位</th><th>審核備註</th><th>requestId</th></tr></thead><tbody id="rows"></tbody></table><main id="cards" class="cards"></main>
<script>
const $=id=>document.getElementById(id),pageSize=50;let offset=0,total=0;
const actions={auto_approve:'系統自動核准',rules_engine:'轉入人工審核',admin_approve:'管理員核准',admin_restore_publish:'管理員恢復發布',admin_reject:'管理員拒絕',admin_update:'管理員更新狀態',report_auto_hide:'達檢舉門檻自動隱藏',auto_expire:'系統自動標記失效',update:'更新投稿'};
const statuses={pending_ai:'AI 處理中',pending_admin:'待管理員審核',needs_revision:'需要補充',approved:'已核准',rejected:'已拒絕',expired:'已失效'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const label=(map,value)=>map[value]||value||'—';
function taiwanTime(value){const date=new Date(value);if(Number.isNaN(date.getTime()))return '—';const p=new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).formatToParts(date);const o={};p.forEach(x=>o[x.type]=x.value);return `${o.year}/${o.month}/${o.day} ${o.hour}:${o.minute}:${o.second}`}
function fields(x){return Array.isArray(x.changedFields)&&x.changedFields.length?x.changedFields.join(', '):'—'}
function values(x){return [taiwanTime(x.actionTime),label(actions,x.action),label(statuses,x.actorRole),x.submissionId||'—',label(statuses,x.previousStatus),label(statuses,x.newStatus),fields(x),x.reviewNote||'—',x.requestId||'—']}
function render(logs){$('rows').innerHTML=logs.map(x=>`<tr>${values(x).map(v=>`<td>${esc(v)}</td>`).join('')}</tr>`).join('');$('cards').innerHTML=logs.map(x=>{const names=['操作時間','操作名稱','操作者角色','投稿編號','原始狀態','新狀態','修改欄位','審核備註','requestId'];return `<article class="card"><dl>${values(x).map((v,i)=>`<dt>${names[i]}</dt><dd>${esc(v)}</dd>`).join('')}</dl></article>`}).join('');}
function updateMeta(){const pages=Math.ceil(total/pageSize);$('meta').textContent=`目前總筆數 ${total} 筆，第 ${pages?Math.floor(offset/pageSize)+1:0}／${pages} 頁`;$('prev').disabled=offset===0;$('next').disabled=offset+pageSize>=total}
function headers(){const token=$('token').value.trim();return token?{Authorization:`Bearer ${token}`}:{}}
async function load(reset=false){if(reset)offset=0;const token=$('token').value.trim();if(!token){$('message').textContent='請先輸入管理員 Token。';render([]);total=0;updateMeta();return}sessionStorage.setItem('report_admin_token',token);const q=new URLSearchParams({limit:pageSize,offset});for(const id of ['action','submissionId','dateFrom','dateTo'])if($(id).value)q.set(id,$(id).value);$('message').textContent='';try{const r=await fetch('/api/submission-audit-log?'+q,{headers:headers()}),j=await r.json();if(!r.ok){$('message').textContent=r.status===401?'請先輸入管理員 Token。':r.status===403?'管理員驗證失敗。':'操作紀錄暫時無法載入，請稍後再試。';return}total=Number(j.total)||0;render(Array.isArray(j.logs)?j.logs:[]);if(!total)$('message').textContent='目前沒有操作紀錄。';updateMeta()}catch{$('message').textContent='操作紀錄暫時無法載入，請稍後再試。'}}
$('token').value=sessionStorage.getItem('report_admin_token')||'';$('load').onclick=()=>load(true);$('refresh').onclick=()=>load();$('clear').onclick=()=>{['action','submissionId','dateFrom','dateTo'].forEach(id=>$(id).value='');load(true)};$('prev').onclick=()=>{offset=Math.max(0,offset-pageSize);load()};$('next').onclick=()=>{if(offset+pageSize<total){offset+=pageSize;load()}};updateMeta();
</script></body></html>
