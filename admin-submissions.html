<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>投稿審核 | Taiwan News Map</title><style>body{font:16px system-ui;max-width:980px;margin:24px auto;padding:0 18px;background:#0b1020;color:#e5e7eb}input,select,textarea,button{font:inherit;padding:9px;border-radius:7px;border:1px solid #475569;background:#121a2d;color:inherit}article{border:1px solid #334155;padding:16px;margin:12px 0;border-radius:10px}small,pre{color:#94a3b8}pre{white-space:pre-wrap}button{cursor:pointer}textarea{width:100%;min-height:55px}</style></head><body>
<h1>使用者投稿審核</h1><input id="token" type="password" placeholder="REPORT_ADMIN_TOKEN"><select id="status"><option value="pending_admin">待審核</option><option value="pending_ai">AI 處理中</option><option value="approved">已核准</option><option value="rejected">已拒絕</option><option value="expired">已失效</option></select><button id="load">載入</button><main id="list"></main>
<script>const t=document.querySelector('#token'),s=document.querySelector('#status'),l=document.querySelector('#list');t.value=localStorage.report_admin_token||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function card(x){const r=x.reportSummary||{};return `<article data-id="${esc(x.submissionId)}"><b>${esc(x.title)}</b> <small>${esc(x.status)} · ${esc(x.riskLevel)}</small><p>${esc(x.description)}</p><small>${esc(x.category)} · ${esc(x.address||'未提供地點')}</small><p><small>檢舉：${Number(r.count||0)} 筆／${Number(r.reporterCount||0)} 位；原因：${esc((r.reasons||[]).join(', ')||'無')}；${x.hiddenByReports?'已自動暫時隱藏':'未隱藏'}</small></p><pre>${esc(JSON.stringify(x.aiReviewResult||{},null,2))}</pre><textarea placeholder="審核備註"></textarea><button data-status="approved">恢復／核准</button> <button data-status="pending_admin">維持待審</button> <button data-status="expired">標記失效</button> <button data-status="rejected">拒絕</button></article>`}async function load(){localStorage.report_admin_token=t.value;const q=new URLSearchParams({token:t.value,status:s.value});const r=await fetch('/api/submissions?'+q),j=await r.json();l.innerHTML=r.ok?j.submissions.map(card).join(''):'<p>'+esc(j.error)+'</p>'}document.querySelector('#load').onclick=load;l.onclick=async e=>{const b=e.target.closest('button[data-status]');if(!b)return;const a=b.closest('article'),r=await fetch('/api/submissions?'+new URLSearchParams({token:t.value,submissionId:a.dataset.id}),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:b.dataset.status,reviewNote:a.querySelector('textarea').value})});if(!r.ok)alert((await r.json()).error);load()}</script>
</body></html>
