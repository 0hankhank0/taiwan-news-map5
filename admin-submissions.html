<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>投稿審核 | Taiwan News Map</title><style>body{font:16px system-ui;max-width:980px;margin:24px auto;padding:0 18px;background:#0b1020;color:#e5e7eb}input,select,textarea,button,a.button{font:inherit;padding:9px;border-radius:7px;border:1px solid #475569;background:#121a2d;color:inherit;text-decoration:none}article{border:1px solid #334155;padding:16px;margin:12px 0;border-radius:10px}small,pre{color:#94a3b8}pre{white-space:pre-wrap}button{cursor:pointer}textarea{width:100%;min-height:55px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.toolbar a{margin-left:auto}.admin-nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}.admin-nav a{padding:8px 10px;border:1px solid #475569;border-radius:7px;color:#7dd3fc;text-decoration:none}.admin-nav a.active{color:#e5e7eb;background:#075985;border-color:#0284c7;font-weight:700}</style></head><body>
<nav class="admin-nav" aria-label="管理後台導覽"><a href="/admin-events.html">事件管理</a><a class="active" href="/admin-submissions.html" aria-current="page">投稿審核</a><a href="/admin-action-log.html">投稿紀錄</a><a href="/admin-refresh-log.html">抓取紀錄</a><a href="/admin-reports.html">資料回報</a><a href="/admin-health.html">系統監控</a><a href="/">回到地圖</a></nav>
<div class="toolbar"><h1>投稿審核</h1><a class="button" href="/admin-action-log.html">查看投稿紀錄</a></div>
<div class="toolbar"><input id="token" type="password" autocomplete="off" placeholder="管理員 Token" aria-label="管理員 Token"><select id="status"><option value="pending_admin">待管理員審核</option><option value="pending_ai">AI 處理中</option><option value="approved">已核准</option><option value="rejected">已拒絕</option><option value="expired">已失效</option></select><button id="load">載入</button></div><main id="list"></main>
<script>
const t=document.querySelector('#token'),s=document.querySelector('#status'),l=document.querySelector('#list');t.value=sessionStorage.getItem('report_admin_token')||'';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(x){const r=x.reportSummary||{};return `<article data-id="${esc(x.submissionId)}"><b>${esc(x.title)}</b> <small>${esc(x.status)} ・ ${esc(x.riskLevel)}</small><p>${esc(x.description)}</p><small>${esc(x.category)} ・ ${esc(x.address||'未提供地址')}</small><p><small>檢舉：${Number(r.count||0)} 筆／${Number(r.reporterCount||0)} 人；原因：${esc((r.reasons||[]).join(', ')||'無')}；${x.hiddenByReports?'目前已隱藏':'目前公開'}</small></p><pre>${esc(JSON.stringify(x.aiReviewResult||{},null,2))}</pre><textarea placeholder="審核備註"></textarea><button data-status="approved">核准</button> <button data-status="pending_admin">轉回待審</button> <button data-status="expired">標記失效</button> <button data-status="rejected">拒絕</button></article>`}
function authHeaders(){return t.value?{Authorization:`Bearer ${t.value}`}:{}}
async function load(){sessionStorage.setItem('report_admin_token',t.value);const q=new URLSearchParams({status:s.value});const r=await fetch('/api/submissions?'+q,{headers:authHeaders()}),j=await r.json();l.innerHTML=r.ok?j.submissions.map(card).join(''):'<p>'+esc(j.error)+'</p>'}
document.querySelector('#load').onclick=load;l.onclick=async e=>{const b=e.target.closest('button[data-status]');if(!b)return;const a=b.closest('article'),r=await fetch('/api/submissions?'+new URLSearchParams({submissionId:a.dataset.id}),{method:'PATCH',headers:{'Content-Type':'application/json',...authHeaders()},body:JSON.stringify({status:b.dataset.status,reviewNote:a.querySelector('textarea').value})});if(!r.ok)alert((await r.json()).error);load()}
</script></body></html>
