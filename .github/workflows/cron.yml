name: Taiwan Traffic Scraper

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # ⬅️ 升級到 v4

      - name: Setup Node.js
        uses: actions/setup-node@v4  # ⬅️ 升級到 v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install @upstash/redis

      - name: Run Scraper
        env:
         - name: Run scraper
        run: node scraper.js
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}  # 👈 就是補上這一行！
        run: node scraper.js
