name: Probe PBS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Probe RoadAllServlet (no application writes)
        run: node scripts/probe-pbs-github.mjs
      - name: Upload PBS diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbs-github-probe
          path: scripts/probe-output/pbs-github
          if-no-files-found: error
          retention-days: 3
