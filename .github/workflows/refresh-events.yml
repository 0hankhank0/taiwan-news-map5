name: Refresh Events

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Refresh mode"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - news
          - traffic

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call cron endpoint
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          APP_BASE_URL_SECRET: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MODE: ${{ inputs.mode || 'all' }}
        run: |
          set -euo pipefail
          BASE_URL="${APP_BASE_URL:-$APP_BASE_URL_SECRET}"
          if [ -z "$BASE_URL" ]; then
            echo "::error::Set APP_BASE_URL as a repository variable or secret."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Set CRON_SECRET as a repository secret."
            exit 1
          fi
          BASE_URL="${BASE_URL%/}"
          response="$(curl -fsS -X POST "$BASE_URL/api/cron?mode=$MODE" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json")"
          echo "$response"
          CRON_RESPONSE="$response" node <<'NODE'
          let payload;
          try {
            payload = JSON.parse(process.env.CRON_RESPONSE || "{}");
          } catch (error) {
            console.error("::error::Cron response was not valid JSON.");
            process.exit(1);
          }

          const counts = payload.sourceCounts || {};
          const count = Number(payload.count ?? counts.active ?? 0);
          const summary = {
            success: payload.success,
            skippedByLock: Boolean(payload.skippedByLock),
            mode: payload.mode,
            count,
            cacheTtlSeconds: payload.cacheTtlSeconds,
            durationMs: payload.durationMs,
            sourceCounts: counts,
          };
          console.log(`[cron-summary] ${JSON.stringify(summary)}`);

          if (!payload.success) {
            console.error("::error::Cron endpoint did not report success.");
            process.exit(1);
          }
          if (payload.skippedByLock) process.exit(0);
          if (process.env.MODE === "all" && count <= 0) {
            console.error("::error::Cron returned zero active events for mode=all.");
            process.exit(1);
          }
          NODE
