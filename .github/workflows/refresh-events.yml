name: Refresh Events

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    concurrency:
      group: cron-news
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call cron endpoint
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          APP_BASE_URL_SECRET: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          BASE_URL="${APP_BASE_URL:-$APP_BASE_URL_SECRET}"
          if [ -z "$BASE_URL" ]; then
            echo "::error::Set APP_BASE_URL as a repository variable or secret."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Set CRON_SECRET as a repository secret."
            exit 1
          fi
          BASE_URL="${BASE_URL%/}"

          tmp_body="$(mktemp)"
          trap 'rm -f "$tmp_body"' EXIT

          http_code="$(curl -sS -o "$tmp_body" -w "%{http_code}" -X POST "$BASE_URL/api/cron?mode=news"             -H "Authorization: Bearer $CRON_SECRET"             -H "Content-Type: application/json")"
          response="$(cat "$tmp_body")"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Cron endpoint returned HTTP $http_code."
            CRON_RESPONSE="$response" node <<'NODE'
          const raw = process.env.CRON_RESPONSE || "";
          try {
            const payload = JSON.parse(raw);
            const diagnostic = payload.diagnostic ? String(payload.diagnostic).slice(0, 1000) : "";
            const error = payload.error ? String(payload.error) : "";
            console.error(`Cron error payload: ${JSON.stringify({ error, diagnostic, runId: payload.runId, durationMs: payload.durationMs })}`);
          } catch {
            console.error(`Cron raw response: ${raw.slice(0, 2000)}`);
          }
          NODE
            exit 1
          fi

          CRON_RESPONSE="$response" node <<'NODE'
          let payload;
          try {
            payload = JSON.parse(process.env.CRON_RESPONSE || "{}");
          } catch (error) {
            console.error("::error::Cron response was not valid JSON.");
            process.exit(1);
          }

          const rawCounts = payload.sourceCounts && typeof payload.sourceCounts === "object" ? payload.sourceCounts : {};
          const sourceCounts = Object.fromEntries(
            Object.entries(rawCounts).map(([name, value]) => [String(name).slice(0, 80), Number(value) || 0])
          );
          const count = Number(payload.count ?? sourceCounts.active ?? 0);
          const errorSourceCount = Math.max(0, Number(payload.errorSourceCount) || 0);
          const summary = {
            success: payload.success,
            status: payload.status,
            skippedByLock: Boolean(payload.skippedByLock),
            mode: payload.mode,
            count,
            errorSourceCount,
            cacheTtlSeconds: payload.cacheTtlSeconds,
            durationMs: payload.durationMs,
            sourceCounts,
            aiDiagnostic: payload.aiDiagnostic || null,
            sourceFailures: payload.sourceFailures || {},
            lock: payload.lock || null,
          };
          console.log(`[cron-summary] ${JSON.stringify(summary)}`);

          if (payload.skippedByLock) {
            console.warn(`::warning::Cron skipped because another refresh owns the active lock: ${JSON.stringify(payload.lock || {})}`);
            process.exit(0);
          }
          if (payload.status === "partial_success" && count > 0) {
            console.warn(`::warning::Cron completed with partial success: ${count} active events; ${errorSourceCount} sources failed. sourceFailures=${JSON.stringify(payload.sourceFailures || {})} sourceCounts=${JSON.stringify(sourceCounts)} aiDiagnostic=${JSON.stringify(payload.aiDiagnostic || null)}`);
            process.exit(0);
          }
          if (payload.success === false) {
            console.error("::error::Cron endpoint did not report success.");
            process.exit(1);
          }
          if (payload.success !== true) {
            console.error("::error::Cron endpoint returned an unknown success state.");
            process.exit(1);
          }
          NODE
