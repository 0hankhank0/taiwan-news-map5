name: Refresh Events

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  refresh:
    concurrency:
      group: cron-news
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call cron endpoint
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL }}
          APP_BASE_URL_SECRET: ${{ secrets.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          BASE_URL="${APP_BASE_URL:-$APP_BASE_URL_SECRET}"
          if [ -z "$BASE_URL" ]; then
            echo "::error::Set APP_BASE_URL as a repository variable or secret."
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Set CRON_SECRET as a repository secret."
            exit 1
          fi
          BASE_URL="${BASE_URL%/}"
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          set +e
          http_status="$(curl -sS -X POST "$BASE_URL/api/cron?mode=news" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -o "$response_file" -w "%{http_code}")"
          curl_exit=$?
          set -e
          response="$(cat "$response_file")"
          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::Cron request failed in curl (exit $curl_exit, HTTP ${http_status:-unknown})."
          fi
          if [ "${http_status:-000}" -ge 400 ] 2>/dev/null; then
            CRON_RESPONSE="$response" CRON_HTTP_STATUS="$http_status" node <<'NODE'
          const secretValues = [process.env.CRON_SECRET, process.env.APP_BASE_URL, process.env.APP_BASE_URL_SECRET]
            .filter(Boolean)
            .sort((a, b) => b.length - a.length);
          let body = String(process.env.CRON_RESPONSE || "");
          for (const secret of secretValues) body = body.split(secret).join("[redacted-secret]");
          body = body
            .replace(/(authorization|bearer|token|api[_ -]?key|secret|password)\s*[:=]?\s*[^\s,;"'}]+/gi, "$1=[redacted]")
            .replace(/https?:\/\/[^\s?#"']+\?[^\s"']*/gi, (url) => url.split("?")[0])
            .replace(/\s+/g, " ")
            .trim()
            .slice(0, 4000);
          console.error(`::error::Cron endpoint returned HTTP ${process.env.CRON_HTTP_STATUS}. Safe response body: ${body || "<empty>"}`);
          NODE
          fi
          if [ "$curl_exit" -ne 0 ] || [ "${http_status:-000}" -ge 400 ] 2>/dev/null; then
            exit 22
          fi
          CRON_RESPONSE="$response" node <<'NODE'
          let payload;
          try {
            payload = JSON.parse(process.env.CRON_RESPONSE || "{}");
          } catch (error) {
            console.error("::error::Cron response was not valid JSON.");
            process.exit(1);
          }

          const rawCounts = payload.sourceCounts && typeof payload.sourceCounts === "object" ? payload.sourceCounts : {};
          const sourceCounts = Object.fromEntries(
            Object.entries(rawCounts).map(([name, value]) => [String(name).slice(0, 80), Number(value) || 0])
          );
          const count = Number(payload.count ?? sourceCounts.active ?? 0);
          const errorSourceCount = Math.max(0, Number(payload.errorSourceCount) || 0);
          const summary = {
            success: payload.success,
            status: payload.status,
            skippedByLock: Boolean(payload.skippedByLock),
            mode: payload.mode,
            count,
            errorSourceCount,
            cacheTtlSeconds: payload.cacheTtlSeconds,
            durationMs: payload.durationMs,
            sourceCounts,
            lock: payload.lock || null,
          };
          console.log(`[cron-summary] ${JSON.stringify(summary)}`);

          if (payload.skippedByLock) {
            console.warn(`::warning::Cron skipped because another refresh owns the active lock: ${JSON.stringify(payload.lock || {})}`);
            process.exit(0);
          }
          if (payload.status === "partial_success" && count > 0) {
            console.warn(`::warning::Cron completed with partial success: ${count} active events; ${errorSourceCount} sources failed. sourceCounts=${JSON.stringify(sourceCounts)}`);
            process.exit(0);
          }
          if (payload.success === false) {
            console.error("::error::Cron endpoint did not report success.");
            process.exit(1);
          }
          if (payload.success !== true) {
            console.error("::error::Cron endpoint returned an unknown success state.");
            process.exit(1);
          }
          NODE
