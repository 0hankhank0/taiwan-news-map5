name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: |
          node --check scraper.js
          node --check event-refresh.js
          node --check event-store.js
          node --check admin-auth.js
          node --check assets/index/main.mjs
