        .custom-popup .leaflet-popup-content-wrapper { 
            background: rgba(255, 255, 255, 0.95);

            padding: 4px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);

        }
        .custom-popup .leaflet-popup-content {
            margin: 12px 16px;
            line-height: 1.5;
        }
        .custom-popup .leaflet-popup-tip {
            background: rgba(255, 255, 255, 0.95);
        }

        /* Marker Icon 樣式 */
        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);

            color: white;
            font-size: 14px;

        .custom-marker:hover {
            transform: scale(1.1);
            z-index: 1000 !important;
        }
        
        /* 交通路段動畫 - 黃黑虛線效果 */
        .line-construction {
            stroke-dasharray: 10, 10;

            to { stroke-dashoffset: -200; }

        async function fetchOSRMRoute(start, end) {
            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${start[1]},${start[0]};${end[1]},${end[0]}?overview=full&geometries=geojson`;
                const res = await fetch(url);
                const data = await res.json();
                if (data.code === 'Ok' && data.routes && data.routes.length > 0) {
                    return data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]);
                }
            } catch (e) {
                console.error("OSRM 路由獲取失敗", e);
            }
            return [start, end]; 
        }

        }

        function highlightCity(cityName) {
            if (geoLayer) map.removeLayer(geoLayer);
            if (!taiwanGeoJSON || cityName === 'all' || !isTaiwanMode) return;

            geoLayer = L.geoJson(taiwanGeoJSON, {
                filter: (f) => f.properties.COUNTYNAME === cityName,
                style: { color: '#3b82f6', weight: 2, fillOpacity: 0.1, dashArray: '5, 5' }
            }).addTo(map);

            const bounds = geoLayer.getBounds();
            if (bounds.isValid()) map.flyToBounds(bounds, { padding: [50, 50], duration: 0.8 });
        }

                async function loadData() {
            const statusEl = document.getElementById("status-text");
            const listEl = document.getElementById("event-list");
            const cityFilter = document.getElementById("city-filter");
            
            statusEl.textContent = "📡 載入資料中...";
            markers.clearLayers();
            listEl.innerHTML = "";
            highlightCity(cityFilter.value);

            try {
                // 1. 放寬過濾條件：只要有座標或是路徑就保留
                let data = parsedEvents.filter((event) => {
                    const lat = parseFloat(event.lat);
                    const lng = parseFloat(event.lng);
                    const isPoint = !isNaN(lat) && !isNaN(lng);
                    const isLine = (event.shape === "line" || event.type === "line") && Array.isArray(event.path) && event.path.length >= 2;
                    return isPoint || isLine;
                });

                data = data.filter((event) => (isTaiwanMode ? event.is_taiwan !== false : true));
                if (isTaiwanMode && cityFilter.value !== "all") {
                    data = data.filter((event) => event.city === cityFilter.value);
                }
                if (activeCategory !== "all") {
                    data = data.filter((event) => event.category === activeCategory);
                }
                if (searchKeyword) {
                    data = data.filter((event) => {
                        const title = (event.title || "").toLowerCase();
                        const content = (event.summary || event.content || "").toLowerCase();
                        const city = (event.city || "").toLowerCase();
                        return title.includes(searchKeyword) || content.includes(searchKeyword) || city.includes(searchKeyword);
                    });
                }

                let successCount = 0;

                await Promise.all(data.map(async (event) => {
                    const categoryConfig = CATEGORY_CONFIG[event.category] || CATEGORY_CONFIG.other;
                    const sourceText = (event.source === "cross-matched") ? "交叉比對" : (event.source === "police" ? "警政" : "新聞");

                    // 2. 給予預設值
                    const title = event.title || "未知標題";
                    const contentSnippet = event.summary || event.content || "無詳細內容";
                    const city = event.city || "未知區域";
                    const url = (event.url && event.url !== "null") ? event.url : "#";
                    const articleLink = (url !== "#")
                        ? `<a href="${url}" target="_blank" rel="noopener noreferrer" class="inline-block mt-2 text-xs text-cyan-300 underline hover:text-cyan-200">閱讀完整報導</a>`
                        : `<span class="inline-block mt-2 text-xs text-gray-500">無原文連結</span>`;
                    
                    const now = new Date();
                    let statusLabel = '';
                    if (event.category === 'activity') {
                        const start = new Date(event.start_date);
                        const end = new Date(event.end_date);
                        if (now < start) {
                            statusLabel = '<span class="ml-2 px-1.5 py-0.5 text-[10px] bg-amber-500 text-white rounded">即將開始</span>';
                        } else if (now >= start && now <= new Date(end.getTime() + 24 * 60 * 60 * 1000)) {
                            statusLabel = '<span class="ml-2 px-1.5 py-0.5 text-[10px] bg-emerald-500 text-white rounded animate-pulse">進行中</span>';
                        }
                    }

                    const popupHtml = `
                        <div class="p-0.5">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="p-2 rounded-lg bg-gray-100">
                                    <i class="fa-solid ${categoryConfig.icon}" style="color: ${categoryConfig.color}"></i>
                                </span>
                                <b class="text-gray-900 text-sm">${title}</b>
                            </div>
                            <div class="text-xs text-gray-600 mb-2 leading-relaxed">${contentSnippet}</div>
                            <div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-100">
                                <span class="text-[10px] text-gray-400 font-medium">${city} · ${sourceText}</span>
                                <div class="flex items-center gap-3">
                                    <button onclick="openReportModal('${(title).replace(/'/g, "\\'")}')" class="report-btn">⚠️ 錯誤回報</button>
                                    ${articleLink}
                                </div>
                            </div>
                        </div>
                    `;

                    const popupOptions = {
                        className: 'custom-popup',
                        maxWidth: 280,
                        offset: [0, -5]
                    };

                    let layer;
                    let focusLatLng = [parseFloat(event.lat), parseFloat(event.lng)];

                    if ((event.shape === "line" || event.type === "line") && Array.isArray(event.path) && event.path.length >= 2) {
                        const start = event.path[0];
                        const end = event.path[event.path.length - 1];
                        
                        const routeCoords = await fetchOSRMRoute(start, end);
                        
                        const text = `${title} ${contentSnippet}`;
                        const isConstruction = /施工|封閉|改道|維修|maintenance/i.test(text);
                        const severity = Math.max(1, Math.min(5, Number(event.severity) || 3));
                        const lineWeight = 5 + severity;
                        const color = isConstruction ? "#000000" : categoryConfig.lineColor;

                        if (isConstruction) {
                            L.polyline(routeCoords, { color: "#fbbf24", weight: lineWeight, opacity: 0.9 }).addTo(markers);
                            layer = L.polyline(routeCoords, { 
                                color: "#000000", weight: lineWeight, opacity: 1, dashArray: "10, 10", className: "line-construction"
                            }).addTo(markers).bindPopup(popupHtml, popupOptions);
                        } else {
                            layer = L.polyline(routeCoords, { color: color, weight: lineWeight, opacity: 0.8 }).addTo(markers).bindPopup(popupHtml, popupOptions);
                        }
                        focusLatLng = start;
                        successCount++;
                    } else if (!isNaN(focusLatLng[0]) && !isNaN(focusLatLng[1])) {
                        const customIcon = L.divIcon({
                            html: `<div class="custom-marker" style="background-color: ${categoryConfig.color}; width: 32px; height: 32px;">
                                    <i class="fa-solid ${categoryConfig.icon}"></i>
                                   </div>`,
                            className: '',
                            iconSize: [32, 32],
                            iconAnchor: [16, 16]
                        });

                        layer = L.marker(focusLatLng, { icon: customIcon }).addTo(markers).bindPopup(popupHtml, popupOptions);
                        successCount++;
                    } else {
                        return;
                    }

                    const item = document.createElement("div");
                    item.className = "news-item p-4 hover:bg-gray-100 cursor-pointer border-l-4 border-transparent hover:border-blue-500 transition-all text-gray-800 bg-white";
                    const listTitle = (url !== "#")
                        ? `<a href="${url}" target="_blank" rel="noopener noreferrer" class="hover:underline" onclick="event.stopPropagation()">${title}</a>`
                        : `<span>${title}</span>`;
                    const listLink = (url !== "#")
                        ? `<a href="${url}" target="_blank" rel="noopener noreferrer" class="text-xs text-cyan-300 underline hover:text-cyan-200 mt-1 inline-block" onclick="event.stopPropagation()">閱讀完整報導</a>`
                        : `<span class="text-xs text-gray-500 mt-1 inline-block">無原文連結</span>`;
                    
                    item.innerHTML = `<div class="flex justify-between mb-1"><span class="text-xs font-bold text-blue-400">${city}</span><div class="flex gap-1">${statusLabel}<span class="${categoryConfig.badgeClass}">${categoryConfig.text}</span></div></div><div class="text-[10px] text-gray-400 mb-1">${sourceText}</div><h3 class="text-sm font-semibold">${listTitle}</h3>${listLink}`;
                    
                    item.onclick = () => {
                        map.flyTo(focusLatLng, 14, { duration: 0.5 });
                        layer.openPopup();
                    };
                    listEl.appendChild(item);
                }));
                statusEl.textContent = `✅ 已更新 (${successCount} 則)`;
            } catch (err) {
                console.error(err);
                statusEl.textContent = "❌ 資料渲染失敗";
            }
        }

        function switchMode(mode) {
            isTaiwanMode = mode;
            document.getElementById("city-filter").classList.toggle("hidden", !mode);
            document.getElementById("btn-tw").className = mode ? "px-6 py-1.5 rounded-md bg-blue-600 font-medium" : "px-6 py-1.5 rounded-md hover:bg-gray-800";
            document.getElementById("btn-global").className = !mode ? "px-6 py-1.5 rounded-md bg-blue-600 font-medium" : "px-6 py-1.5 rounded-md hover:bg-gray-800";
            if (geoLayer) map.removeLayer(geoLayer);
            map.flyTo(mode ? [23.6, 120.9] : [20, 0], mode ? 7 : 2);
            loadData();
        }
        
        
        function handleSearch(event) {
            searchKeyword = event.target.value.toLowerCase().trim();
            loadData();
        }

        function setCategoryFilter(category) {
            activeCategory = category;
            document.querySelectorAll('[id^="cat-"]').forEach((btn) => btn.classList.remove("active"));
            const activeBtn = document.getElementById(`cat-${category}`);
            if (activeBtn) activeBtn.classList.add("active");
            loadData();
        }

        // 以本機後端代理 RSS，避免前端直接用 allorigins 造成不穩定。
        async function fetchOneRSS(rssUrl) {
            const res = await fetch(`/api/rss?url=${encodeURIComponent(rssUrl)}`);
            if (!res.ok) {
                const error = await res.json().catch(() => ({}));
                throw new Error(error.error || `RSS 請求失敗 (${res.status})`);
            }
            return res.json();
        }

        // 統一走本機 /api/parse（後端抓 RSS + 警政紀錄後交給 Groq）。
        async function parseNewsWithAI(payload) {
            const body = (typeof payload === "string") ? { prompt: payload } : payload;
            try {
                const res = await fetch("/api/parse", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body || {})
                });
                if (!res.ok) {
                    const error = await res.json().catch(() => ({}));
                    console.error("AI 解析請求失敗", res.status, error);
                    return [];
                }
                return res.json();
            } catch (error) {
                console.error("AI 解析請求例外", error);
                return [];
            }
        }

        function normalizeEvents(aiResult) {
            const arr = Array.isArray(aiResult) ? aiResult : (Array.isArray(aiResult?.events) ? aiResult.events : []);
            return arr.map((item) => {
                const city = item.city || "全台灣";
                let lat = Number(item.lat);
                let lng = Number(item.lng);
                if ((!Number.isFinite(lat) || !Number.isFinite(lng)) && CITY_COORDS[city]) {
                    [lat, lng] = CITY_COORDS[city];
                }
                const coordinates = Array.isArray(item.coordinates) && item.coordinates.length === 2
                    ? [Number(item.coordinates[0]), Number(item.coordinates[1])]
                    : null;
                const normalizedPath = Array.isArray(item.path)
                    ? item.path
                        .map((p) => [Number(p?.[0]), Number(p?.[1])])
                        .filter((p) => Number.isFinite(p[0]) && Number.isFinite(p[1]))
                    : [];
                const type = (item.type === "line" || item.shape === "line") ? "line" : "point";
                const shape = (type === "line" && normalizedPath.length >= 2) ? "line" : "point";
                if (shape === "point" && coordinates && Number.isFinite(coordinates[0]) && Number.isFinite(coordinates[1])) {
                    lat = coordinates[0];
                    lng = coordinates[1];
                }
                return {
                    title: item.title || "未命名新聞",
                    summary: item.summary || item.content || "",
                    content: item.content || item.summary || "",
                    city,
                    lat: Number.isFinite(lat) ? lat : null,
                    lng: Number.isFinite(lng) ? lng : null,
                    shape,
                    type: shape,
                    coordinates: (Number.isFinite(lat) && Number.isFinite(lng)) ? [lat, lng] : null,
                    path: shape === "line" ? normalizedPath : [],
                    severity: Math.max(1, Math.min(5, Number(item.severity) || 3)),
                    category: ["traffic", "construction", "crime", "disaster", "activity", "other"].includes(item.category) ? item.category : "other",
                    published_date: item.published_date,
                    start_date: item.start_date,
                    end_date: item.end_date,
                    source: item.source === "police" || item.source === "cross-matched" ? item.source : "news",
                    url: String(item.url || item.link || ""),
                    is_taiwan: item.is_taiwan !== false
                };
            }).filter((item) => (item.shape === "line" && item.path.length >= 2) || (Number.isFinite(item.lat) && Number.isFinite(item.lng)));
        }

                        async function syncNewsAndRender() {
            const statusEl = document.getElementById("status-text");
            statusEl.textContent = "📡 正在從雲端更新資料...";

            try {
                const res = await fetch("/api/events");
                if (!res.ok) throw new Error("API 請求失敗");
                const data = await res.json();
                console.log("📡 前端收到資料:", data);

                // 智慧拆包裹：相容不同的 JSON 根 Key 格式
                parsedEvents = Array.isArray(data) ? data : (data.events || data.data || data.items || data.news || []);

                if (!parsedEvents || !parsedEvents.length) {
                    statusEl.textContent = "⚠️ 目前暫無最新事件";
                    return;
                }

                loadData();
                statusEl.textContent = "✅ 資料已更新 (" + parsedEvents.length + " 則)";
            } catch (err) {
                console.error("❌ 載入失敗:", err);
                statusEl.textContent = "❌ 資料載入失敗";
            }
        }

        
        function syncCityFilter(val) {
            document.getElementById('city-filter').value = val;
            loadData();
        }

        // 擴充 loadData 顯示數量到手機面板
        const originalLoadData = loadData;
        loadData = async function() {
            await originalLoadData();
            const count = document.querySelectorAll('.news-item').length;
            const mobileCount = document.getElementById('mobile-count');
            if (mobileCount) mobileCount.textContent = `${count} 則事件`;
        };

        // 網頁載入後自動執行
        document.addEventListener('DOMContentLoaded', () => {
            fetchGeoData().then(syncNewsAndRender);
            setCategoryFilter("all");
        });
        
        // Modal 邏輯
        function checkBetaModal() {
            const hasAccepted = localStorage.getItem('beta_accepted');
            if (!hasAccepted) {
                document.getElementById('beta-modal').classList.remove('hidden');
            }
        }

        function closeModal() {
            localStorage.setItem('beta_accepted', 'true');
            document.getElementById('beta-modal').classList.add('hidden');
        }

        window.addEventListener('DOMContentLoaded', checkBetaModal);

        // 錯誤回報邏輯
        function openReportModal(title) {
            document.getElementById('report-title').value = title;
            document.getElementById('report-modal').classList.remove('hidden');
        }

        function closeReportModal() {
            document.getElementById('report-modal').classList.add('hidden');
            document.getElementById('report-message').value = '';
        }

        async function submitReport() {
            const title = document.getElementById('report-title').value;
            const errorType = document.getElementById('report-type').value;
            const message = document.getElementById('report-message').value;
            const btn = document.getElementById('report-submit-btn');

            btn.disabled = true;
            btn.textContent = '傳送中...';

            try {
                const res = await fetch('/api/report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ title, errorType, message })
                });

                if (res.ok) {
                    alert('感謝回報！我們會盡快修正。');
                    closeReportModal();
                } else {
                    throw new Error('發送失敗');
                }
            } catch (err) {
                alert('回報失敗，請稍後再試。');
            } finally {
                btn.disabled = false;
                btn.textContent = '送出回報';
            }
        }


    </script>
