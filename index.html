<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>剛剛發生什麼 - 台灣即時地圖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        /* 基礎設置 */
        html, body { height: 100vh; width: 100%; margin: 0; padding: 0; overflow: hidden; }
        
        /* 響應式佈局架構 */
        .main-container { display: flex; height: 100vh; width: 100%; flex-direction: column; }
        @media (min-width: 768px) {
            .main-container { flex-direction: row; }
        }

        #map { flex: 1; height: 100%; width: 100%; z-index: 1; }

        /* 電腦版側邊欄 */
        .news-sidebar { 
            background: #111827; 
            display: flex; 
            flex-direction: column; 
            border-right: 1px solid #374151;
            z-index: 10;
        }
        @media (min-width: 768px) {
            .news-sidebar { width: 350px; height: 100vh; }
        }

        /* 手機版底部抽屜 (Bottom Sheet) */
        @media (max-width: 767px) {
            .news-sidebar { 
                position: fixed; 
                bottom: 0; left: 0; right: 0; 
                height: 70vh; 
                background: white; 
                border-radius: 24px 24px 0 0;
                box-shadow: 0 -10px 25px rgba(0,0,0,0.2);
                transform: translateY(calc(70vh - 100px));
                transition: transform 0.3s ease-out;
                z-index: 9999 !important;
                color: #1f2937;
            }
            .news-sidebar.expanded { transform: translateY(0); }
            .news-sidebar .news-list { color: #1f2937; }
        }

        /* 贊助按鈕樣式 */
        .sponsor-btn {
            background: linear-gradient(135deg, #ffd700 0%, #ffcc00 100%);
            color: #5d4037 !important;
            font-weight: 800;
            border: 2px solid #5d4037;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.2s;
        }
        .sponsor-btn:hover { transform: scale(1.05); filter: brightness(1.1); }

        /* 標籤與按鈕樣式 */
        .badge {
            padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; color: white !important;
        }
        .filter-btn { opacity: 0.7; cursor: pointer; transition: 0.2s; }
        .filter-btn.active { opacity: 1; transform: scale(1.1); box-shadow: 0 0 10px rgba(255,255,255,0.3); }

        /* 地圖控制項位置微調 */
        .leaflet-bottom.leaflet-right { margin-bottom: 110px; }
        @media (min-width: 768px) {
            .leaflet-bottom.leaflet-right { margin-bottom: 20px; }
        }

        /* Popup 樣式 */
        .custom-popup .leaflet-popup-content-wrapper { border-radius: 12px; padding: 5px; }
        .news-list::-webkit-scrollbar { width: 4px; }
        .news-list::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-900 text-white">

    <div class="main-container">
        <!-- 側邊欄 / 底部抽屜 -->
        <aside id="sidebar" class="news-sidebar">
            <!-- 手機版拉條 -->
            <div class="md:hidden w-full py-4 cursor-pointer" onclick="toggleSidebar()">
                <div class="w-12 h-1.5 bg-gray-300 rounded-full mx-auto"></div>
            </div>

            <!-- 標題與過濾器 -->
            <div class="px-5 py-4 border-b border-gray-700">
                <div class="flex justify-between items-center mb-4">
                    <h1 class="text-lg font-bold">📍 剛剛發生什麼</h1>
                    <span id="event-count" class="text-xs bg-blue-600 px-2 py-0.5 rounded-full">載入中</span>
                </div>
                
                <input type="text" id="search-input" oninput="handleSearch(event)" 
                    placeholder="🔍 搜尋事件..." 
                    class="w-full bg-gray-800 text-sm border border-gray-700 rounded-lg px-3 py-2 mb-4 outline-none focus:border-blue-500">
                
                <div id="category-container" class="flex flex-wrap gap-2 overflow-x-auto no-scrollbar">
                    <!-- 動態生成的按鈕會放在這 -->
                </div>
            </div>

            <!-- 事件列表 -->
            <div id="news-list" class="news-list flex-1 overflow-y-auto divide-y divide-gray-700">
                <!-- 卡片會動態插入 -->
            </div>

            <!-- 電腦版贊助按鈕 -->
            <div class="hidden md:block p-4 border-t border-gray-700">
                <a href="https://taiwan-map.bobaboba.me" target="_blank" class="flex items-center justify-center gap-2 w-full py-3 rounded-xl sponsor-btn">
                    <span>☕ 贊助作者</span>
                </a>
            </div>
        </aside>

        <!-- 地圖 -->
        <section id="map"></section>

        <!-- 手機版懸浮贊助按鈕 -->
        <a href="https://taiwan-map.bobaboba.me" target="_blank" class="md:hidden fixed bottom-28 right-4 z-[500] w-14 h-14 rounded-full sponsor-btn flex items-center justify-center text-2xl shadow-2xl">
            ☕
        </a>
    </div>

    <script>
        const map = L.map("map", { zoomControl: false }).setView([23.6, 120.9], 7);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        const markers = L.layerGroup().addTo(map);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

        let parsedEvents = [];
        let activeCategory = "all";
        let searchKeyword = "";

        const CATEGORY_CONFIG = {
            all: { text: "全部", color: "#4b5563" },
            traffic: { text: "交通", color: "#ef4444" },
            construction: { text: "施工", color: "#f97316" },
            politics: { text: "政治", color: "#3b82f6" },
            social: { text: "社會", color: "#ec4899" },
            disaster: { text: "災害", color: "#dc2626" },
            life: { text: "生活", color: "#f59e0b" },
            other: { text: "其他", color: "#6b7280" }
        };

        function toggleSidebar() {
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.toggle('expanded');
            }
        }

        function renderCategories() {
            const container = document.getElementById('category-container');
            const categories = new Set(['all']);
            parsedEvents.forEach(ev => categories.add(ev.category));

            container.innerHTML = Array.from(categories).map(cat => {
                const config = CATEGORY_CONFIG[cat] || { text: cat, color: "#6b7280" };
                const activeClass = activeCategory === cat ? 'active' : '';
                return `<button onclick="setFilter('${cat}')" class="filter-btn badge ${activeClass}" style="background-color: ${config.color} !important">${config.text}</button>`;
            }).join('');
        }

        function setFilter(cat) {
            activeCategory = cat;
            loadData();
        }

        function handleSearch(e) {
            searchKeyword = e.target.value.toLowerCase();
            loadData();
        }

        async function loadData() {
            markers.clearLayers();
            const listEl = document.getElementById('news-list');
            listEl.innerHTML = "";

            const filtered = parsedEvents.filter(ev => {
                const matchCat = activeCategory === 'all' || ev.category === activeCategory;
                const matchSearch = (ev.title + ev.content).toLowerCase().includes(searchKeyword);
                return matchCat && matchSearch;
            });

            document.getElementById('event-count').textContent = `${filtered.length} 則`;

            filtered.forEach(ev => {
                const config = CATEGORY_CONFIG[ev.category] || CATEGORY_CONFIG.other;
                const latlng = [ev.lat, ev.lng];
                
                // 地圖圖釘
                const marker = L.marker(latlng, {
                    icon: L.divIcon({
                        html: `<div style="background:${config.color}; width:12px; height:12px; border-radius:50%; border:2px solid white;"></div>`,
                        className: ''
                    })
                }).addTo(markers);

                marker.bindPopup(`<b class="text-gray-900">${ev.title}</b><p class="text-xs text-gray-600">${ev.content}</p>`);

                // 列表卡片
                const card = document.createElement('div');
                card.className = "p-4 hover:bg-gray-800 cursor-pointer transition-colors";
                if (window.innerWidth < 768) card.className = "p-4 hover:bg-gray-100 cursor-pointer border-b";
                
                card.innerHTML = `
                    <div class="flex justify-between mb-1">
                        <span class="text-xs text-blue-400 font-bold">${ev.city || '台灣'}</span>
                        <span class="badge" style="background:${config.color} !important">${config.text || ev.category}</span>
                    </div>
                    <div class="text-sm font-bold">${ev.title}</div>
                    <div class="text-xs text-gray-400 mt-1 line-clamp-2">${ev.content}</div>
                `;
                card.onclick = () => {
                    map.flyTo(latlng, 15);
                    marker.openPopup();
                    if (window.innerWidth < 768) toggleSidebar();
                };
                listEl.appendChild(card);
            });
            renderCategories();
        }

        async function init() {
            try {
                const res = await fetch('/api/events');
                parsedEvents = await res.json();
                loadData();
            } catch (e) {
                console.error("載入失敗", e);
            }
        }

        init();
    </script>
</body>
</html>
