<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>剛剛發生什麼 - 縣市篩選全能版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <style>
        #map { height: 100vh; width: 100%; }
        @media (min-width: 768px) {
            #map { height: calc(100vh - 64px); }
        }
        
        /* 現代化 Popup 樣式 */
        .custom-popup .leaflet-popup-content-wrapper { 
            background: rgba(255, 255, 255, 0.95); 
            color: #1f2937; 
            border-radius: 16px; 
            padding: 4px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .custom-popup .leaflet-popup-content {
            margin: 12px 16px;
            line-height: 1.5;
        }

        /* Marker Icon 樣式 */
        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            transition: all 0.2s;
            color: white;
            font-size: 14px;
        }
        .custom-marker:hover {
            transform: scale(1.1);
            z-index: 1000 !important;
        }
        
        /* 側邊欄與列表滾動修正 */
        .news-sidebar { 
            width: 320px; 
            max-width: 36vw; 
            display: flex;
            flex-direction: column;
        }
        
        .news-list { 
            flex: 1;
            overflow-y: auto !important; 
            -webkit-overflow-scrolling: touch;
        }

        /* 桌機版高度限制 */
        @media (min-width: 768px) {
            .news-list { height: calc(100vh - 180px); }
        }

        /* 現代化細長滾輪樣式 */
        .news-list::-webkit-scrollbar {
            width: 4px;
        }
        .news-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .news-list::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 10px;
        }

        /* 事件分類標籤顏色更新 */
        .badge {
            display: inline-block;
            padding: 4px 10px;
            font-size: 0.75rem;
            font-weight: 600;
            color: white !important;
            border-radius: 12px;
            line-height: 1;
            text-align: center;
            white-space: nowrap;
            border: none !important;
        }
        .badge-traffic { background-color: #3b82f6 !important; } /* 交通: 藍色 */
        .badge-construction { background-color: #f97316 !important; } /* 施工: 橘色 */
        .badge-disaster { background-color: #ef4444 !important; } /* 災害: 紅色 */
        .badge-police { background-color: #8b5cf6 !important; } /* 執法: 紫色 */
        .badge-activity { background-color: #10b981 !important; } /* 活動: 綠色 */
        .badge-other { background-color: #6b7280 !important; } /* 其他: 灰色 */
        .badge-all { background-color: #374151 !important; }

        /* Beta 版免責聲明 Modal 樣式 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
        }
        .modal-card {
            background: white;
            color: #1f2937;
            padding: 2rem;
            border-radius: 20px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* 錯誤回報 Modal 樣式 */
        .report-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            backdrop-filter: blur(4px);
        }
        .report-modal-card {
            background: white;
            color: #1f2937;
            padding: 1.5rem;
            border-radius: 16px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        .report-btn {
            color: #94a3b8;
            font-size: 11px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: color 0.2s;
        }
        .report-btn:hover { color: #ef4444; }

    </style>
</head>
<body class="bg-gray-900 text-white overflow-hidden">

    <script>
        const map = L.map("map", { zoomControl: false }).setView([23.6, 120.9], 7);
        L.control.zoom({ position: 'bottomright' }).addTo(map);
        const markers = L.layerGroup().addTo(map);
        let geoLayer = null;
        let taiwanGeoJSON = null;

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);

        let isTaiwanMode = true;
        let parsedEvents = [];
        let activeCategory = "all";
        let searchKeyword = "";

        const CITY_COORDS = {
            "基隆市": [25.1276, 121.7392], "臺北市": [25.0330, 121.5654], "新北市": [25.0169, 121.4628],
            "桃園市": [24.9937, 121.3009], "新竹市": [24.8138, 120.9675], "新竹縣": [24.8387, 121.0177],
            "宜蘭縣": [24.7021, 121.7378], "苗栗縣": [24.5602, 120.8214], "臺中市": [24.1477, 120.6736],
            "彰化縣": [24.0685, 120.5575], "南投縣": [23.9609, 120.9719], "雲林縣": [23.7092, 120.4313],
            "嘉義市": [23.4801, 120.4491], "嘉義縣": [23.4518, 120.2555], "臺南市": [22.9997, 120.2270],
            "高雄市": [22.6273, 120.3014], "屏東縣": [22.5519, 120.5488], "花蓮縣": [23.9872, 121.6015],
            "臺東縣": [22.7583, 121.1444], "澎湖縣": [23.5712, 119.5793], "金門縣": [24.4321, 118.3171],
            "連江縣": [26.1605, 119.9517]
        };

        const CATEGORY_CONFIG = {
            traffic: { text: "🚦 交通路況", icon: "fa-car", color: "#3b82f6", badgeClass: "badge badge-traffic" },
            construction: { text: "🚧 道路施工", icon: "fa-person-digging", color: "#f97316", badgeClass: "badge badge-construction" },
            disaster: { text: "🔥 災害事故", icon: "fa-triangle-exclamation", color: "#ef4444", badgeClass: "badge badge-disaster" },
            police: { text: "👮 警察執法", icon: "fa-shield-halved", color: "#8b5cf6", badgeClass: "badge badge-police" },
            activity: { text: "🎊 活動訊息", icon: "fa-users", color: "#10b981", badgeClass: "badge badge-activity" },
            other: { text: "ℹ️ 其他資訊", icon: "fa-circle-info", color: "#6b7280", badgeClass: "badge badge-other" }
        };

        async function fetchGeoData() {
            try {
                const res = await fetch('https://raw.githubusercontent.com/g0v/twgeojson/master/json/twCounty2010.geo.json');
                taiwanGeoJSON = await res.json();
            } catch (e) { console.error("GeoJSON 載入失敗"); }
        }

        function highlightCity(cityName) {
            if (geoLayer) map.removeLayer(geoLayer);
            if (!taiwanGeoJSON || cityName === 'all' || !isTaiwanMode) return;
            geoLayer = L.geoJson(taiwanGeoJSON, {
                filter: (f) => f.properties.COUNTYNAME === cityName,
                style: { color: '#3b82f6', weight: 2, fillOpacity: 0.1, dashArray: '5, 5' }
            }).addTo(map);
            const bounds = geoLayer.getBounds();
            if (bounds.isValid()) map.flyToBounds(bounds, { padding: [50, 50], duration: 0.8 });
        }

        async function loadData() {
            const statusEl = document.getElementById("status-text");
            const listEl = document.getElementById("event-list");
            const cityFilter = document.getElementById("city-filter");
            
            statusEl.textContent = "📡 載入資料中...";
            markers.clearLayers();
            listEl.innerHTML = "";
            highlightCity(cityFilter.value);

            try {
                let data = parsedEvents.filter((event) => {
                    const lat = parseFloat(event.lat);
                    const lng = parseFloat(event.lng);
                    return !isNaN(lat) && !isNaN(lng);
                });

                if (isTaiwanMode && cityFilter.value !== "all") {
                    data = data.filter((event) => event.city === cityFilter.value);
                }
                if (activeCategory !== "all") {
                    data = data.filter((event) => event.category === activeCategory);
                }
                if (searchKeyword) {
                    data = data.filter((event) => {
                        const title = (event.title || "").toLowerCase();
                        const content = (event.content || "").toLowerCase();
                        return title.includes(searchKeyword) || content.includes(searchKeyword);
                    });
                }

                data.forEach((event) => {
                    const config = CATEGORY_CONFIG[event.category] || CATEGORY_CONFIG.other;
                    const sourceText = event.source || "新聞報導";
                    const latlng = [parseFloat(event.lat), parseFloat(event.lng)];

                    const popupHtml = `
                        <div class="p-0.5">
                            <div class="flex items-center gap-2 mb-2">
                                <span class="p-2 rounded-lg bg-gray-100">
                                    <i class="fa-solid ${config.icon}" style="color: ${config.color}"></i>
                                </span>
                                <b class="text-gray-900 text-sm">${event.title}</b>
                            </div>
                            <div class="text-xs text-gray-600 mb-2">${event.content}</div>
                            <div class="flex justify-between items-center mt-3 pt-2 border-t border-gray-100">
                                <span class="text-[10px] text-gray-400 font-medium">${event.city} · ${sourceText}</span>
                                <button onclick="openReportModal('${(event.title).replace(/'/g, "\\'")}')" class="report-btn">⚠️ 回報</button>
                            </div>
                        </div>
                    `;

                    const customIcon = L.divIcon({
                        html: `<div class="custom-marker" style="background-color: ${config.color}; width: 32px; height: 32px;">
                                <i class="fa-solid ${config.icon}"></i>
                               </div>`,
                        className: '',
                        iconSize: [32, 32],
                        iconAnchor: [16, 16]
                    });

                    const marker = L.marker(latlng, { icon: customIcon }).addTo(markers).bindPopup(popupHtml, { className: 'custom-popup', maxWidth: 280 });

                    const item = document.createElement("div");
                    item.className = "news-item p-4 hover:bg-gray-50 cursor-pointer border-l-4 border-transparent hover:border-blue-500 transition-all text-gray-800 bg-white";
                    item.innerHTML = `
                        <div class="flex justify-between mb-1">
                            <span class="text-xs font-bold text-blue-500">${event.city}</span>
                            <span class="${config.badgeClass}">${config.text}</span>
                        </div>
                        <div class="text-[10px] text-gray-400 mb-1">${sourceText}</div>
                        <h3 class="text-sm font-semibold">${event.title}</h3>
                    `;
                    
                    item.onclick = () => {
                        map.flyTo(latlng, 14, { duration: 0.5 });
                        marker.openPopup();
                    };
                    listEl.appendChild(item);
                });

                statusEl.textContent = `✅ 已更新 (${data.length} 則)`;
                document.getElementById('mobile-count').textContent = `${data.length} 則事件`;
            } catch (err) {
                console.error(err);
                statusEl.textContent = "❌ 渲染失敗";
            }
        }

        async function syncNewsAndRender() {
            const statusEl = document.getElementById("status-text");
            statusEl.textContent = "📡 同步中...";
            try {
                const res = await fetch("/api/events");
                parsedEvents = await res.json();
                loadData();
            } catch (err) {
                statusEl.textContent = "❌ 同步失敗";
            }
        }

        function switchMode(mode) {
            isTaiwanMode = mode;
            map.flyTo(mode ? [23.6, 120.9] : [20, 0], mode ? 7 : 2);
            loadData();
        }

        function handleSearch(event) {
            searchKeyword = event.target.value.toLowerCase().trim();
            loadData();
        }

        function setCategoryFilter(category) {
            activeCategory = category;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`cat-${category}`).classList.add('active');
            loadData();
        }

        function syncCityFilter(val) {
            document.getElementById('city-filter').value = val;
            loadData();
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchGeoData().then(syncNewsAndRender);
        });

        function checkBetaModal() {
            if (!localStorage.getItem('beta_accepted')) document.getElementById('beta-modal').classList.remove('hidden');
        }
        function closeModal() {
            localStorage.setItem('beta_accepted', 'true');
            document.getElementById('beta-modal').classList.add('hidden');
        }
        window.addEventListener('DOMContentLoaded', checkBetaModal);

        function openReportModal(title) {
            document.getElementById("report-title").value = title;
            document.getElementById("report-modal").classList.remove("hidden");
        }
        function closeReportModal() { document.getElementById("report-modal").classList.add("hidden"); }

        async function submitReport() {
            const btn = document.getElementById("report-submit-btn");
            btn.disabled = true; btn.textContent = "傳送中...";
            try {
                await fetch('/api/report', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: document.getElementById("report-title").value,
                        errorType: document.getElementById("report-type").value,
                        message: document.getElementById("report-message").value
                    })
                });
                alert('感謝回報！');
                closeReportModal();
            } catch (err) { alert('回報失敗'); }
            finally { btn.disabled = false; btn.textContent = "送出回報"; }
        }
    </script>
</body>
</html>
