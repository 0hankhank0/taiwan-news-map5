<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>監控頁 | Island Pulse Beta</title>
  <style>
    :root { color-scheme:dark; --bg:#0b1020; --panel:#121a2d; --line:rgba(148,163,184,.24); --text:#e5e7eb; --muted:#94a3b8; --accent:#38bdf8; --ok:#34d399; --warn:#fbbf24; --danger:#fb7185; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { position:sticky; top:0; background:rgba(11,16,32,.94); border-bottom:1px solid var(--line); backdrop-filter:blur(16px); }
    .wrap { max-width:1180px; margin:0 auto; padding:20px; }
    h1 { margin:0 0 4px; font-size:22px; }
    .sub,.status { color:var(--muted); font-size:13px; }
    .nav { display:flex; gap:10px; margin:14px 0; flex-wrap:wrap; }
    a { color:var(--accent); }
    .toolbar { display:grid; grid-template-columns:minmax(220px,1fr) 120px; gap:10px; margin-top:16px; }
    input,button { border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--text); font:inherit; padding:10px 12px; }
    button { cursor:pointer; font-weight:700; }
    button.primary { background:#075985; border-color:#0284c7; }
    .grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; margin-top:18px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:16px; }
    .label { color:var(--muted); font-size:12px; margin-bottom:6px; }
    .value { font-size:24px; font-weight:800; }
    .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--danger); }
    pre { white-space:pre-wrap; overflow:auto; background:#070b16; border:1px solid var(--line); border-radius:8px; padding:12px; color:#cbd5e1; }
    @media (max-width:820px) { .toolbar,.grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <h1>營運監控 <span class="status">BETA / 非官方警報系統</span></h1>
      <p class="sub">只顯示設定是否存在與資料狀態，不顯示任何 secret 值。</p>
      <div class="nav">
        <a href="/admin-events.html">事件管理</a>
        <a href="/admin-reports.html">回報後台</a>
        <a href="/">回地圖</a>
      </div>
      <div class="toolbar">
        <input id="token" type="password" placeholder="REPORT_ADMIN_TOKEN" autocomplete="off" />
        <button id="load" class="primary" type="button">更新</button>
      </div>
    </div>
  </header>
  <main class="wrap">
    <div id="status" class="status">尚未載入。</div>
    <section id="cards" class="grid"></section>
    <pre id="detail"></pre>
  </main>
  <script>
    const tokenEl = document.getElementById("token");
    const statusEl = document.getElementById("status");
    const cardsEl = document.getElementById("cards");
    const detailEl = document.getElementById("detail");
    tokenEl.value = localStorage.getItem("report_admin_token") || "";

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", "\"":"&quot;", "'":"&#039;" }[ch]));
    }
    function card(label, value, cls = "") {
      return `<div class="card"><div class="label">${escapeHtml(label)}</div><div class="value ${cls}">${escapeHtml(value)}</div></div>`;
    }
    function boolLabel(value) { return value ? "OK" : "缺少"; }
    function boolClass(value) { return value ? "ok" : "warn"; }
    async function loadHealth() {
      const token = tokenEl.value.trim();
      localStorage.setItem("report_admin_token", token);
      statusEl.textContent = "載入中...";
      cardsEl.innerHTML = "";
      detailEl.textContent = "";
      try {
        const response = await fetch(`/api/health?token=${encodeURIComponent(token)}`, { cache: "no-store" });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
        const age = data.events.newestEventAgeMinutes;
        cardsEl.innerHTML = [
          card("事件數", data.events.total),
          card("最新事件分鐘前", age === null ? "未知" : age, age !== null && age <= 90 ? "ok" : "warn"),
          card("待處理回報", data.reports.pending, data.reports.pending > 0 ? "warn" : "ok"),
          card("KV", boolLabel(data.cache.hasKv), boolClass(data.cache.hasKv)),
          card("TDX", boolLabel(data.integrations.tdxCredentials), boolClass(data.integrations.tdxCredentials)),
          card("OpenAI/Azure", boolLabel(data.integrations.openAiKey || data.integrations.azureOpenAi), boolClass(data.integrations.openAiKey || data.integrations.azureOpenAi)),
          card("Mapbox", boolLabel(data.integrations.mapboxPublicToken), boolClass(data.integrations.mapboxPublicToken)),
          card("Discord", boolLabel(data.integrations.discordWebhook), boolClass(data.integrations.discordWebhook)),
          card("綠界", boolLabel(data.integrations.ecpay), boolClass(data.integrations.ecpay)),
        ].join("");
        statusEl.textContent = `更新時間 ${data.generatedAt}，仍為 beta 監控資料。`;
        detailEl.textContent = JSON.stringify(data, null, 2);
      } catch (error) {
        statusEl.textContent = `載入失敗：${error.message}`;
      }
    }
    document.getElementById("load").addEventListener("click", loadHealth);
  </script>
</body>
</html>
