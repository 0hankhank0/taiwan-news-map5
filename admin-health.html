<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><title>系統監控 | Taiwan News Map</title><style>:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--line:#334155;--text:#e5e7eb;--muted:#94a3b8;--accent:#38bdf8;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui}.wrap{max-width:1180px;margin:auto;padding:20px}.admin-nav{display:flex;gap:8px;margin:0 0 16px;flex-wrap:wrap}.admin-nav a,a.button{padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--accent);text-decoration:none}.admin-nav a.active{color:var(--text);background:#075985;border-color:#0284c7;font-weight:700}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}input,button{border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--text);font:inherit;padding:10px 12px}button{cursor:pointer;font-weight:700}button.primary{background:#075985;border-color:#0284c7}.status{color:var(--muted);font-size:13px;min-height:1.5em}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}.label{color:var(--muted);font-size:12px;margin-bottom:6px}.value{font-size:20px;word-break:break-word}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}pre{overflow:auto;white-space:pre-wrap;background:var(--panel);border:1px solid var(--line);padding:14px;border-radius:8px}@media(max-width:720px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><nav class="admin-nav" aria-label="管理後台導覽"><a href="/admin-events.html">事件管理</a><a href="/admin-submissions.html">投稿審核</a><a href="/admin-action-log.html">投稿紀錄</a><a href="/admin-refresh-log.html">抓取紀錄</a><a href="/admin-reports.html">資料回報</a><a class="active" href="/admin-health.html" aria-current="page">系統監控</a><a href="/">回到地圖</a></nav><h1>系統監控</h1><p class="status">查看事件、整合與最新資料抓取狀態。</p><div class="toolbar"><input id="token" type="password" placeholder="REPORT_ADMIN_TOKEN" autocomplete="off"><button id="load" class="primary">載入</button><a class="button" href="/admin-refresh-log.html">查看完整抓取紀錄</a></div><p id="status" class="status"></p><section id="cards" class="grid"></section><h2>完整 JSON 詳細資料</h2><pre id="detail"></pre></main><script>
const tokenEl=document.getElementById('token'),statusEl=document.getElementById('status'),cardsEl=document.getElementById('cards'),detailEl=document.getElementById('detail');tokenEl.value=sessionStorage.getItem('report_admin_token')||'';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const card=(l,v,c='')=>`<article class="card"><div class="label">${esc(l)}</div><div class="value ${c}">${esc(v)}</div></article>`;const tw=v=>{const d=new Date(v);return Number.isNaN(d)?'—':new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',dateStyle:'short',timeStyle:'medium',hour12:false}).format(d)};
async function loadHealth(){const token=tokenEl.value.trim();sessionStorage.setItem('report_admin_token',token);statusEl.textContent='載入中…';cardsEl.innerHTML='';detailEl.textContent='';try{const r=await fetch('/api/health',{headers:token?{Authorization:`Bearer ${token}`}:{},cache:'no-store'}),d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);const f=d.refresh||{},s=f.sourceCounts||{},rate=f.geocodingAttempts?`${Math.round(f.geocodingHits/f.geocodingAttempts*100)}%`:'—',cls=f.status==='success'?'ok':f.status==='error'?'bad':'warn';cardsEl.innerHTML=[card('最近一次執行狀態',f.status||'unknown',cls),card('最近一次完成時間',tw(f.lastCompletedAt)),card('執行耗時',`${(Number(f.durationMs||0)/1000).toFixed(1)} 秒`),card('最終事件數',s.active||0),card('RSS 數',s.rssItems||0),card('TDX 數',s.tdx||0),card('活動數',s.activities||0),card('定位成功率',rate),card('最近一次錯誤',f.lastError?.message||'—',f.lastError?'bad':'')].join('');statusEl.textContent=`更新時間：${tw(d.generatedAt)}`;detailEl.textContent=JSON.stringify(d,null,2)}catch(e){statusEl.textContent=`載入失敗：${e.message}`}}document.getElementById('load').onclick=loadHealth;
</script></body></html>
