<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Island Pulse Video Opening</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #02050b;
      --panel: rgba(18, 26, 38, 0.84);
      --panel-strong: rgba(24, 34, 48, 0.94);
      --line: rgba(134, 168, 210, 0.17);
      --text: #f4f8ff;
      --muted: #91a8c5;
      --accent: #ff3b4f;
      --cyan: #6bb7ff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    }

    body {
      display: grid;
      place-items: center;
    }

    .stage {
      position: relative;
      width: min(100vw, 177.7778vh);
      height: min(100vh, 56.25vw);
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at 50% 46%, rgba(25, 64, 100, 0.28), transparent 35%),
        radial-gradient(circle at 14% 20%, rgba(22, 63, 95, 0.24), transparent 26%),
        linear-gradient(180deg, #030712 0%, var(--bg) 45%, #000 100%);
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: -5%;
      opacity: 0.52;
      background-image:
        linear-gradient(var(--line) 1px, transparent 1px),
        linear-gradient(90deg, var(--line) 1px, transparent 1px);
      background-size: 86px 86px;
      mask-image: radial-gradient(circle at 50% 47%, #000 0%, transparent 72%);
      animation: gridDrift 8s linear both;
      z-index: 0;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(0, 0, 0, 0.42), transparent 22%, transparent 78%, rgba(0, 0, 0, 0.46)),
        linear-gradient(180deg, rgba(0, 0, 0, 0.42), transparent 28%, transparent 70%, rgba(0, 0, 0, 0.62));
      z-index: 20;
    }

    .map-noise {
      position: absolute;
      inset: 0;
      z-index: 1;
      opacity: 0.5;
      background:
        radial-gradient(circle at 51% 45%, transparent 0 7%, rgba(88, 133, 178, 0.1) 7.2% 7.6%, transparent 7.9%),
        radial-gradient(circle at 51% 45%, transparent 0 14%, rgba(88, 133, 178, 0.08) 14.3% 14.7%, transparent 15%),
        linear-gradient(115deg, transparent 0 44%, rgba(109, 157, 203, 0.12) 44.3% 44.7%, transparent 45%),
        linear-gradient(32deg, transparent 0 53%, rgba(109, 157, 203, 0.08) 53.3% 53.7%, transparent 54%);
      animation: mapFade 8s ease both;
    }

    .scanline {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      top: -4%;
      z-index: 3;
      opacity: 0;
      background: linear-gradient(90deg, transparent, rgba(101, 187, 255, 0.6), transparent);
      box-shadow: 0 0 26px rgba(101, 187, 255, 0.36);
      animation: scan 8s ease-in-out both;
    }

    .notification {
      position: absolute;
      left: 50%;
      top: 11%;
      width: 610px;
      max-width: 70%;
      z-index: 8;
      padding: 24px 26px 20px;
      border: 1px solid rgba(185, 207, 238, 0.2);
      border-radius: 26px;
      color: var(--text);
      background:
        linear-gradient(180deg, rgba(42, 52, 67, 0.96), rgba(15, 23, 34, 0.92)),
        rgba(18, 26, 38, 0.92);
      box-shadow:
        0 38px 90px rgba(0, 0, 0, 0.62),
        inset 0 1px 0 rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(20px);
      transform: translate(-50%, -28px) scale(0.96);
      opacity: 0;
      animation: notificationIn 8s cubic-bezier(.18, .9, .19, 1.08) both;
    }

    .notification-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      color: #c9d8ea;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.01em;
    }

    .now {
      color: #879bb6;
      font-size: 17px;
      font-weight: 600;
    }

    .notification-title {
      margin: 0 0 10px;
      font-size: 33px;
      line-height: 1.15;
      font-weight: 850;
      letter-spacing: 0.01em;
    }

    .notification-copy {
      margin: 0;
      color: #d3deeb;
      font-size: 22px;
      line-height: 1.55;
      font-weight: 500;
    }

    .notification-hint {
      margin-top: 18px;
      color: #7e91aa;
      font-size: 16px;
      letter-spacing: 0.08em;
    }

    .fragments {
      position: absolute;
      inset: 0;
      z-index: 9;
      pointer-events: none;
      animation: overloadOut 8s ease both;
    }

    .fragment {
      position: absolute;
      left: 50%;
      top: 50%;
      width: var(--w);
      min-height: var(--h);
      padding: var(--pad);
      border-radius: var(--radius);
      border: 1px solid rgba(160, 191, 230, var(--border));
      opacity: 0;
      color: rgba(244, 248, 255, var(--text-opacity));
      background:
        linear-gradient(180deg, rgba(33, 47, 66, var(--alpha)), rgba(11, 17, 27, calc(var(--alpha) + 0.06))),
        rgba(13, 20, 31, 0.82);
      box-shadow:
        0 22px 48px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      transform: translate(var(--sx), var(--sy)) rotate(var(--sr)) scale(0.76);
      animation: fragmentFly var(--duration) cubic-bezier(.12, .78, .18, 1) var(--delay) both;
    }

    .fragment::before {
      content: "";
      position: absolute;
      left: 14px;
      top: 14px;
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--dot);
      box-shadow: 0 0 15px color-mix(in srgb, var(--dot), transparent 35%);
    }

    .fragment-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 7px 16px;
      color: rgba(145, 168, 197, 0.85);
      font-size: var(--meta);
      line-height: 1;
      white-space: nowrap;
    }

    .fragment-title {
      margin-left: 16px;
      font-size: var(--title);
      line-height: 1.22;
      font-weight: 780;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .fragment-sub {
      margin: 7px 0 0 16px;
      color: rgba(171, 190, 215, 0.72);
      font-size: var(--sub);
      line-height: 1.25;
      white-space: nowrap;
    }

    .center-pin-layer {
      position: absolute;
      inset: 0;
      z-index: 6;
      pointer-events: none;
      opacity: 0;
      animation: pinReveal 8s ease both;
    }

    .center-pin {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 82px;
      height: 106px;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 22px 36px rgba(0, 0, 0, 0.56));
    }

    .center-pin::before,
    .center-pin::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 39px;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.35);
      opacity: 0;
      border: 1px solid rgba(255, 64, 82, 0.46);
      box-shadow: 0 0 30px rgba(255, 47, 68, 0.22);
      animation: pinRipple 8s ease both;
    }

    .center-pin::after {
      width: 112px;
      height: 112px;
      border-color: rgba(255, 64, 82, 0.28);
      animation-delay: 0.18s;
    }

    .pin-head {
      position: absolute;
      left: 50%;
      top: 32px;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: linear-gradient(180deg, #ff6571 0%, #f73549 46%, #c8132d 100%);
      box-shadow:
        0 0 0 10px rgba(255, 47, 68, 0.11),
        0 0 48px rgba(255, 47, 68, 0.72),
        inset 0 1px 0 rgba(255, 255, 255, 0.38);
    }

    .pin-head::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      background: #fff;
      box-shadow: inset 0 0 0 5px rgba(215, 25, 53, 0.16);
    }

    .pin-tail {
      position: absolute;
      left: 50%;
      top: 60px;
      width: 24px;
      height: 44px;
      transform: translateX(-50%);
      background: linear-gradient(180deg, #d71935 0%, #a70c23 100%);
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      filter: drop-shadow(0 0 18px rgba(255, 47, 68, 0.48));
    }

    .question-card {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 18;
      width: min(960px, 80%);
      transform: translate(-50%, -42%);
      text-align: center;
      opacity: 0;
      filter: blur(10px);
      animation: questionIn 8s cubic-bezier(.18, .82, .24, 1) both;
    }

    .blackout {
      position: absolute;
      inset: 0;
      z-index: 14;
      pointer-events: none;
      background: #000;
      opacity: 0;
      animation: blackoutIn 8s ease both;
    }

    .question-card p {
      margin: 0;
      font-size: clamp(38px, 4.6vw, 78px);
      line-height: 1.12;
      font-weight: 760;
      letter-spacing: -0.015em;
    }

    .question-card p:first-child {
      color: #f6f9ff;
      text-shadow: 0 0 24px rgba(215, 228, 244, 0.14);
    }

    .question-card p:last-child {
      margin-top: 14px;
      color: #8298b7;
      font-weight: 650;
    }

    .corner-data {
      position: absolute;
      z-index: 2;
      color: rgba(132, 158, 193, 0.56);
      font-size: 17px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      opacity: 0;
      animation: dataFlicker 8s steps(1, end) both;
    }

    .corner-data.left {
      left: 54px;
      bottom: 46px;
    }

    .corner-data.right {
      right: 54px;
      top: 44px;
      text-align: right;
    }

    @keyframes notificationIn {
      0%,
      15% {
        opacity: 0;
        transform: translate(-50%, -46px) scale(0.95);
        filter: blur(10px);
      }
      19% {
        opacity: 0.72;
      }
      23% {
        opacity: 1;
        transform: translate(-50%, 8px) scale(1.012);
        filter: blur(0);
      }
      30% {
        transform: translate(-50%, 0) scale(1);
      }
      64% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
        filter: blur(0);
      }
      72% {
        opacity: 0.18;
        transform: translate(-50%, -8px) scale(0.985);
        filter: blur(2px);
      }
      76%,
      100% {
        opacity: 0;
        transform: translate(-50%, -10px) scale(0.98);
        filter: blur(8px);
      }
    }

    @keyframes fragmentFly {
      0% {
        opacity: 0;
        transform: translate(var(--sx), var(--sy)) rotate(var(--sr)) scale(0.72);
        filter: blur(8px);
      }
      12% {
        opacity: var(--op);
      }
      54%,
      100% {
        opacity: var(--op);
        transform: translate(var(--ex), var(--ey)) rotate(var(--er)) scale(var(--scale));
        filter: blur(0);
      }
    }

    @keyframes overloadOut {
      0%,
      75% {
        opacity: 1;
        filter: blur(0);
        transform: scale(1);
      }
      82% {
        opacity: 0.5;
        filter: blur(14px);
        transform: scale(1.035);
      }
      89%,
      100% {
        opacity: 0;
        filter: blur(24px);
        transform: scale(1.065);
      }
    }

    @keyframes pinReveal {
      0%,
      53.75% {
        opacity: 0;
        filter: blur(7px);
      }
      57% {
        opacity: 1;
        filter: blur(0);
      }
      63% {
        opacity: 1;
      }
      70% {
        opacity: 0.8;
        filter: blur(0);
      }
      75% {
        opacity: 0.12;
        filter: blur(8px);
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes pinRipple {
      0%,
      54% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.28);
      }
      58% {
        opacity: 0.8;
      }
      68% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.16);
      }
      100% {
        opacity: 0;
      }
    }

    @keyframes questionIn {
      0%,
      76% {
        opacity: 0;
        transform: translate(-50%, -38%) scale(0.985);
        filter: blur(10px);
      }
      84% {
        opacity: 1;
        transform: translate(-50%, -42%) scale(1);
        filter: blur(0);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -42%) scale(1);
        filter: blur(0);
      }
    }

    @keyframes blackoutIn {
      0%,
      75% {
        opacity: 0;
      }
      84%,
      100% {
        opacity: 0.94;
      }
    }

    @keyframes gridDrift {
      0% {
        transform: translate3d(0, 0, 0) scale(1.02);
        opacity: 0.18;
      }
      25%,
      66% {
        opacity: 0.52;
      }
      100% {
        transform: translate3d(-32px, 22px, 0) scale(1.05);
        opacity: 0.03;
      }
    }

    @keyframes mapFade {
      0%,
      72% {
        opacity: 0.5;
      }
      90%,
      100% {
        opacity: 0;
      }
    }

    @keyframes scan {
      0%,
      23% {
        opacity: 0;
        top: -4%;
      }
      28% {
        opacity: 0.8;
      }
      58% {
        opacity: 0.45;
        top: 98%;
      }
      72%,
      100% {
        opacity: 0;
        top: 112%;
      }
    }

    @keyframes dataFlicker {
      0%,
      18% {
        opacity: 0;
      }
      22%,
      70% {
        opacity: 1;
      }
      72%,
      100% {
        opacity: 0;
      }
    }

    @media (max-aspect-ratio: 16 / 9) {
      .notification {
        max-width: 78%;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Island Pulse 8-second opening animation">
    <div class="map-noise"></div>
    <div class="scanline"></div>

    <section class="notification" aria-label="緊急警報通知">
      <div class="notification-top">
        <span>⚠️ 緊急警報</span>
        <span class="now">現在</span>
      </div>
      <h1 class="notification-title">颱風警報發布</h1>
      <p class="notification-copy">中央氣象署發布颱風警報，凱米颱風持續接近台灣，請注意強風豪雨。</p>
      <div class="notification-hint">滑動以檢視詳細資訊</div>
    </section>

    <div class="center-pin-layer" aria-hidden="true">
      <div class="center-pin">
        <div class="pin-tail"></div>
        <div class="pin-head"></div>
      </div>
    </div>

    <section class="fragments" id="fragments" aria-label="資訊碎片"></section>

    <div class="corner-data left">23.6978 N&nbsp;&nbsp;120.9605 E / LIVE INCIDENT FIELD</div>
    <div class="corner-data right">ISLAND PULSE<br>SPATIAL SIGNAL LOST</div>

    <div class="blackout" aria-hidden="true"></div>

    <section class="question-card" aria-label="closing question">
      <p>Too much information.</p>
      <p>Not enough spatial context.</p>
    </section>
  </main>

  <script>
    const fragmentData = [
      ["CWA Alert", "強風豪雨", "北部沿海瞬間陣風增強"],
      ["Traffic", "道路封閉", "山區路段預警性封閉"],
      ["Local report", "台南積水", "中西區回報水位上升"],
      ["Highway", "國道壅塞", "國一南下車速低於 35"],
      ["School / Work", "停班停課？", "各縣市晚間陸續公布"],
      ["Nearby", "附近事故", "距離 1.8km / 待確認"],
      ["Weather", "氣象警報", "豪雨特報範圍擴大"],
      ["PTT Live", "PTT 即時回報", "多區停電影響號誌"],
      ["Emergency", "河川水位上升", "低窪區域請留意"],
      ["Transit", "捷運延誤", "部分班距調整中"],
      ["Social", "路樹倒塌", "現場照片持續更新"],
      ["Dispatch", "消防出勤", "多件淹水案件派遣"],
      ["CCTV", "地下道封閉", "影像來源不穩定"],
      ["Newsroom", "快訊更新", "災情位置仍在比對"],
      ["Community", "停電回報", "行政區資料重疊"],
      ["Sensor", "雨量急升", "10 分鐘累積異常"],
      ["Inbox", "民眾通報", "同一路段重複回報"],
      ["Map layer", "定位失準", "事件座標待校正"]
    ];

    const layouts = [
      [-760, -360, -390, -208, -11, 340, 92, 0.92],
      [710, -330, 270, -246, 7, 300, 86, 0.76],
      [-830, 170, -466, 22, 9, 280, 78, 0.7],
      [820, 160, 256, 34, -8, 320, 90, 0.88],
      [-520, -470, -178, -300, 6, 360, 96, 0.82],
      [520, 445, 174, 254, 13, 286, 82, 0.7],
      [0, -560, -36, -142, -4, 310, 88, 0.86],
      [0, 560, 28, 156, 5, 334, 92, 0.9],
      [-900, -45, -214, -44, -18, 250, 74, 0.64],
      [890, -48, 130, -88, 14, 270, 72, 0.68],
      [-660, 425, -332, 196, -7, 300, 82, 0.78],
      [660, -440, 356, -116, 10, 250, 72, 0.64],
      [-240, 520, -104, 285, 3, 340, 88, 0.75],
      [240, -520, 74, -322, -9, 306, 84, 0.74],
      [-980, -240, -38, 58, 15, 254, 70, 0.58],
      [980, 255, 54, 78, -15, 266, 72, 0.62],
      [-420, 520, 214, 176, 8, 282, 78, 0.66],
      [430, -530, -260, 110, -12, 292, 76, 0.72]
    ];

    const colors = ["#ff4b5f", "#67b7ff", "#f3c85b", "#54d6a3"];
    const fragments = document.getElementById("fragments");

    fragmentData.forEach((item, index) => {
      const [source, title, subtitle] = item;
      const [sx, sy, ex, ey, er, width, height, opacity] = layouts[index];
      const card = document.createElement("article");
      card.className = "fragment";
      card.style.setProperty("--sx", `${sx}px`);
      card.style.setProperty("--sy", `${sy}px`);
      card.style.setProperty("--ex", `${ex}px`);
      card.style.setProperty("--ey", `${ey}px`);
      card.style.setProperty("--sr", `${er * -1.7}deg`);
      card.style.setProperty("--er", `${er}deg`);
      card.style.setProperty("--w", `${width}px`);
      card.style.setProperty("--h", `${height}px`);
      card.style.setProperty("--op", opacity);
      card.style.setProperty("--alpha", 0.58 + (index % 4) * 0.055);
      card.style.setProperty("--border", 0.13 + (index % 5) * 0.025);
      card.style.setProperty("--text-opacity", 0.82 + (index % 3) * 0.05);
      card.style.setProperty("--scale", 0.86 + (index % 4) * 0.045);
      card.style.setProperty("--delay", `${2.4 + index * 0.12}s`);
      card.style.setProperty("--duration", `${1.05 + (index % 5) * 0.12}s`);
      card.style.setProperty("--dot", colors[index % colors.length]);
      card.style.setProperty("--pad", index % 3 === 0 ? "18px 20px" : "15px 18px");
      card.style.setProperty("--radius", index % 4 === 0 ? "18px" : "14px");
      card.style.setProperty("--meta", index % 5 === 0 ? "12px" : "13px");
      card.style.setProperty("--title", index % 4 === 0 ? "26px" : "23px");
      card.style.setProperty("--sub", index % 3 === 0 ? "13px" : "14px");
      card.innerHTML = `
        <div class="fragment-meta"><span>${source}</span><span>${index < 9 ? "0" : ""}${index + 1}</span></div>
        <div class="fragment-title">${title}</div>
        <div class="fragment-sub">${subtitle}</div>
      `;
      fragments.appendChild(card);
    });
  </script>
</body>
</html>
