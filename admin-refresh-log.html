<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>資料抓取紀錄 | Taiwan News Map</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2d;--panel2:#17213a;--line:#334155;--text:#e5e7eb;--muted:#94a3b8;--accent:#38bdf8;--ok:#34d399;--warn:#fbbf24;--bad:#fb7185}*{box-sizing:border-box}body{font:16px system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;max-width:1240px;margin:24px auto;padding:0 18px;background:radial-gradient(circle at 85% 0,#12314c 0,transparent 28rem),var(--bg);color:var(--text)}h1,h2,h3,p{margin-top:0}.admin-nav,.top,.filters,.pager,.summary{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.admin-nav{margin:0 0 20px}.admin-nav a,a.button,button{padding:8px 10px;border:1px solid var(--line);border-radius:8px;color:var(--accent);text-decoration:none;background:transparent;transition:transform .18s,background .18s,border-color .18s}.admin-nav a.active,button.primary{color:#fff;background:#075985;border-color:#0284c7;font-weight:700}button{cursor:pointer;color:var(--text);font:inherit;background:var(--panel)}button:hover,a.button:hover,.admin-nav a:hover{transform:translateY(-1px);background:var(--panel2)}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.top{justify-content:space-between;align-items:end}.top p{color:var(--muted);margin:4px 0 0}.filters{margin:20px 0;padding:12px;background:rgba(18,26,45,.8);border:1px solid var(--line);border-radius:12px}input,select{font:inherit;padding:9px;border-radius:7px;border:1px solid #475569;background:#0c1426;color:inherit}.filters input[type=password]{min-width:210px}.filters input[type=search]{min-width:180px}.message{color:var(--warn);min-height:1.5em}.meta{color:var(--muted);margin-left:auto}.runs{display:grid;gap:10px}.run{display:grid;grid-template-columns:minmax(160px,1.25fr) minmax(110px,.75fr) minmax(180px,1fr) auto;gap:14px;align-items:center;padding:16px;background:linear-gradient(115deg,rgba(23,33,58,.96),rgba(18,26,45,.9));border:1px solid var(--line);border-radius:12px}.run-time{font-weight:700}.run-time small,.muted{display:block;color:var(--muted);font-size:13px;margin-top:4px}.metrics{display:flex;gap:14px;flex-wrap:wrap;color:#cbd5e1;font-size:14px}.metrics b{color:#fff}.tag{font-weight:700}.success{color:var(--ok)}.partial_success,.skipped{color:var(--warn)}.error{color:var(--bad)}.empty,.notice{padding:18px;border:1px dashed #475569;border-radius:10px;color:var(--muted)}.pager{margin:18px 0}.detail-head,.detail-grid{display:grid;gap:12px}.detail-head{grid-template-columns:1.3fr .7fr;margin:18px 0}.panel,.source{background:rgba(18,26,45,.93);border:1px solid var(--line);border-radius:12px;padding:16px}.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.fact{color:var(--muted);font-size:13px}.fact b{display:block;color:var(--text);font-size:15px;margin-top:3px;word-break:break-word}.flow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap}.flow div{background:#0c1426;border-radius:8px;padding:10px;min-width:110px}.flow b{display:block;font-size:20px}.source-list{display:grid;gap:12px}.source-head{display:flex;justify-content:space-between;gap:10px;align-items:start}.source h3{margin-bottom:3px}.source details{margin-top:12px;background:#0c1426;border-radius:8px;padding:8px}.source summary{cursor:pointer;color:var(--accent)}.item{padding:11px 4px;border-bottom:1px solid #26334a}.item:last-child{border:0}.item-title{font-weight:650}.item-meta{font-size:13px;color:var(--muted);line-height:1.55}.result{font-weight:700}.back{margin:18px 0 4px}@media(max-width:760px){body{margin:16px auto;padding:0 12px}.run{grid-template-columns:1fr;gap:9px}.run a{justify-self:start}.detail-head{grid-template-columns:1fr}.facts{grid-template-columns:1fr}.filters input,.filters select{width:100%}.meta{width:100%;margin-left:0}.pager{justify-content:space-between}}
</style></head><body>
<nav class="admin-nav" aria-label="管理後台導覽"><a href="/admin-events.html">事件管理</a><a href="/admin-submissions.html">投稿審核</a><a href="/admin-action-log.html">投稿紀錄</a><a class="active" href="/admin-refresh-log.html" aria-current="page">抓取紀錄</a><a href="/admin-reports.html">資料回報</a><a href="/admin-health.html">系統監控</a><a href="/">回到地圖</a></nav>
<header class="top"><div><h1 id="title">最近抓取紀錄</h1><p id="subtitle">每一列代表一次獨立的排程或手動抓取批次。</p></div><a class="button" href="/admin-health.html">系統監控</a></header>
<section class="filters" aria-label="抓取紀錄篩選"><input id="token" type="password" autocomplete="off" placeholder="管理員 Token" aria-label="管理員 Token"><button id="load" class="primary">載入紀錄</button><button id="refresh">重新整理</button><select id="status" aria-label="執行狀態"><option value="">全部狀態</option><option value="success">成功</option><option value="partial_success">部分成功</option><option value="error">失敗</option><option value="skipped">已跳過</option></select><select id="mode" aria-label="執行模式"><option value="">全部模式</option><option value="all">全部資料</option><option value="news">新聞與活動</option><option value="traffic">交通與施工</option></select><input id="runIdSearch" type="search" placeholder="runId 搜尋" aria-label="runId 搜尋"><input id="dateFrom" type="date" aria-label="開始日期（選用）"><input id="dateTo" type="date" aria-label="結束日期（選用）"><button id="clear">清除篩選</button></section>
<p id="message" class="message" role="status"></p><main id="content"></main><div id="pager" class="pager"><button id="prev">上一頁</button><button id="next">下一頁</button><span id="meta" class="meta">目前總筆數 0 筆，第 0／0 頁</span></div>
<script>
const $=id=>document.getElementById(id),pageSize=50;let offset=0,total=0;const queryRunId=new URLSearchParams(location.search).get('runId')||'';const labels={success:'成功',partial_success:'部分成功',error:'失敗',skipped:'已跳過',all:'全部資料',news:'新聞與活動',traffic:'交通與施工',scheduled:'排程',manual:'手動',unknown:'未知',fetched:'已抓取',normalized:'已標準化',accepted:'已保留',filtered:'已過濾',duplicate:'重複資料',merged:'已合併',location_failed:'定位失敗',expired:'已過期',source_error:'來源錯誤'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tw=v=>{if(v===null||v===undefined||v==='')return '—';const d=new Date(v);return Number.isNaN(d.getTime())?'—':new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',dateStyle:'medium',timeStyle:'medium',hour12:false}).format(d)};const sec=v=>`${(Number(v||0)/1000).toFixed(1)} 秒`;function headers(){const t=$('token').value.trim();return t?{Authorization:`Bearer ${t}`}:{}}function statusClass(v){return ['success','partial_success','error','skipped'].includes(v)?v:''}
function listRun(x){const raw=x.rawCount||0,final=x.sourceCounts?.normalized||0;return `<article class="run"><div class="run-time">${esc(tw(x.startedAt))}<small>完成：${esc(tw(x.completedAt))}</small></div><div><span class="tag ${statusClass(x.status)}">${esc(labels[x.status]||x.status)}</span><small class="muted">${esc(labels[x.mode]||x.mode)}・${esc(sec(x.durationMs))}</small></div><div class="metrics"><span>原始 <b>${raw}</b></span><span>最終保留 <b>${final}</b></span><span>錯誤來源 <b>${x.errorSourceCount||0}</b></span><small>${esc(x.runId)}</small></div><a class="button" href="/admin-refresh-log.html?runId=${encodeURIComponent(x.runId)}">${x.status==='error'?'查看錯誤':'查看本次抓取'}</a></article>`}
function updateMeta(){const pages=Math.ceil(total/pageSize);$('meta').textContent=`目前總筆數 ${total} 筆，第 ${pages?Math.floor(offset/pageSize)+1:0}／${pages} 頁`;$('prev').disabled=offset===0;$('next').disabled=offset+pageSize>=total}
async function getJson(url){const r=await fetch(url,{headers:headers(),cache:'no-store'}),j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||`HTTP ${r.status}`),{status:r.status});return j}
async function loadList(reset=false){if(reset)offset=0;const token=$('token').value.trim();if(!token){$('message').textContent='請先輸入管理員 Token。';return}sessionStorage.setItem('report_admin_token',token);$('message').textContent='';const q=new URLSearchParams({limit:pageSize,offset});for(const [id,key] of [['status','status'],['mode','mode'],['runIdSearch','runId'],['dateFrom','dateFrom'],['dateTo','dateTo']])if($(id).value)q.set(key,$(id).value);try{const d=await getJson('/api/refresh-log?'+q);total=Number(d.total)||0;$('content').innerHTML=d.logs?.length?`<section class="runs">${d.logs.map(listRun).join('')}</section>`:'<p class="empty">目前沒有符合條件的抓取批次。</p>';updateMeta()}catch(e){$('message').textContent=e.status===401?'請先輸入管理員 Token。':e.status===403?'管理員驗證失敗。':'抓取紀錄暫時無法載入。'}}
function fact(label,value,cls=''){return `<div class="fact">${esc(label)}<b class="${cls}">${esc(value)}</b></div>`}function renderItems(items){if(!items?.length)return '<p class="muted">此區沒有可保留的項目明細。</p>';return items.map(x=>`<article class="item"><div class="item-title">${esc(x.title)}</div><div class="item-meta">來源：${esc(x.source)}　類別：${esc(x.category||'—')}　地點：${esc(x.location||'—')}<br>取得時間：${esc(tw(x.fetchedAt))}${x.url?`　<a href="${esc(x.url)}" target="_blank" rel="noopener">原始網址</a>`:''}<br><span class="result ${statusClass(x.processingResult)}">${esc(labels[x.processingResult]||x.processingResult)}</span>${x.processingReason?`：${esc(x.processingReason)}`:''}${x.eventId?`　→ ${esc(x.eventId)}`:''}</div></article>`).join('')}
function sourceBlock(key,name,s){return `<section class="source"><div class="source-head"><div><h3>${esc(name)}</h3><span class="tag ${statusClass(s.status)}">${esc(labels[s.status]||s.status)}</span><small class="muted">${s.count||0} 筆・${sec(s.durationMs)}</small></div>${s.error?`<p class="error">${esc(s.error)}</p>`:''}</div><details><summary>查看 ${s.items?.length||0} 筆項目</summary>${renderItems(s.items)}</details></section>`}
async function loadDetail(){const token=$('token').value.trim();if(!token){$('message').textContent='請先輸入管理員 Token，再載入此批次詳情。';return}sessionStorage.setItem('report_admin_token',token);$('message').textContent='';try{const d=await getJson('/api/refresh-log?detail=1&runId='+encodeURIComponent(queryRunId)),r=d.run,x=d.details;if(!x){$('content').innerHTML=`<a class="button back" href="/admin-refresh-log.html">返回抓取紀錄</a><p class="notice">此批次的詳細資料已到期或不再保存；仍可查看上方摘要。</p>${listRun(r)}`;return}const p=x.pipeline||{},s=x.sources||{};$('content').innerHTML=`<a class="button back" href="/admin-refresh-log.html">返回抓取紀錄</a><section class="detail-head"><article class="panel"><h2>${esc(tw(r.startedAt))} 的抓取批次</h2><div class="facts">${fact('runId',r.runId)}${fact('狀態',labels[r.status]||r.status,statusClass(r.status))}${fact('模式',labels[r.mode]||r.mode)}${fact('觸發方式',labels[r.trigger]||r.trigger)}${fact('開始時間',tw(r.startedAt))}${fact('完成時間',tw(r.completedAt))}${fact('執行耗時',sec(r.durationMs))}${fact('最終地圖事件數',r.sourceCounts?.active||0)}${fact('快取寫入',x.cacheWritten?'成功':'未寫入',x.cacheWritten?'success':'error')}${fact('定位成功／嘗試',`${r.geocodingHits||0}／${r.geocodingAttempts||0}`)}</div>${x.error?`<p class="error">${esc(x.error)}</p>`:''}</article><article class="panel"><h2>處理流程</h2><div class="flow"><div>原始抓取<b>${p.rawCount||0}</b></div><div>標準化<b>${p.normalizedCount||0}</b></div><div>過濾<b>${p.filteredCount||0}</b></div><div>重複／合併<b>${p.duplicateCount||0}</b></div><div>最終保留<b>${p.finalCount||0}</b></div></div></article></section><section class="source-list">${sourceBlock('rss','RSS 新聞',s.rss||{})}${sourceBlock('tdxTraffic','TDX 即時交通',s.tdxTraffic||{})}${sourceBlock('tdxConstruction','TDX 施工資訊',s.tdxConstruction||{})}${sourceBlock('kktix','KKTIX 活動',s.kktix||{})}${sourceBlock('ai','AI 提取事件',s.ai||{})}${sourceBlock('ruleBased','規則式提取事件',s.ruleBased||{})}${sourceBlock('location','定位處理',s.location||{})}<section class="source"><h3>最終事件</h3><details open><summary>查看 ${x.finalEvents?.length||0} 筆最終事件</summary>${renderItems(x.finalEvents)}</details></section></section>`}catch(e){console.error('Failed to load refresh detail:', e);$('message').textContent=e.status===404?'找不到此抓取批次。':'抓取詳情暫時無法載入。'}}
$('token').value=sessionStorage.getItem('report_admin_token')||'';$('load').onclick=()=>queryRunId?loadDetail():loadList(true);$('refresh').onclick=()=>queryRunId?loadDetail():loadList();$('clear').onclick=()=>{['status','mode','runIdSearch','dateFrom','dateTo'].forEach(id=>$(id).value='');loadList(true)};$('prev').onclick=()=>{offset=Math.max(0,offset-pageSize);loadList()};$('next').onclick=()=>{if(offset+pageSize<total){offset+=pageSize;loadList()}};if(queryRunId){$('title').textContent='抓取批次詳情';$('subtitle').textContent=`runId：${queryRunId}`;$('pager').hidden=true;loadDetail()}else if($('token').value)loadList(true);
</script></body></html>
