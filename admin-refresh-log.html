<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>資料抓取紀錄 | Taiwan News Map</title><style>
:root{color-scheme:dark}body{font:16px system-ui;max-width:1380px;margin:24px auto;padding:0 18px;background:#0b1020;color:#e5e7eb}h1{margin:0}.top,.filters,.pager{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0}input,select,button,a.button{font:inherit;padding:9px;border-radius:7px;border:1px solid #475569;background:#121a2d;color:inherit}button,a.button{cursor:pointer;text-decoration:none}.top a{margin-left:auto}.message{color:#fbbf24;min-height:1.5em}.meta{color:#94a3b8;margin-left:auto}table{width:100%;border-collapse:collapse;background:#10182b;border:1px solid #334155;font-size:14px}th,td{padding:10px;vertical-align:top;text-align:left;border-bottom:1px solid #26334a;word-break:break-word}th{color:#cbd5e1;background:#121a2d;white-space:nowrap}.cards{display:none}.card{border:1px solid #334155;border-radius:10px;background:#10182b;padding:13px;margin:10px 0}.card dl{display:grid;grid-template-columns:7em 1fr;gap:8px;margin:0}.card dt{color:#94a3b8}.card dd{margin:0;word-break:break-word}.ok{color:#34d399}.bad{color:#fb7185}.skip{color:#fbbf24}.admin-nav{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}.admin-nav a{padding:8px 10px;border:1px solid #475569;border-radius:7px;color:#7dd3fc;text-decoration:none}.admin-nav a.active{color:#e5e7eb;background:#075985;border-color:#0284c7;font-weight:700}@media(max-width:760px){table{display:none}.cards{display:block}.meta{margin-left:0;width:100%}.top a{margin-left:0}.filters input,.filters select{max-width:100%;box-sizing:border-box}.pager{justify-content:space-between}}
</style></head><body>
<nav class="admin-nav" aria-label="管理後台導覽"><a href="/admin-events.html">事件管理</a><a href="/admin-submissions.html">投稿審核</a><a href="/admin-action-log.html">投稿紀錄</a><a class="active" href="/admin-refresh-log.html" aria-current="page">抓取紀錄</a><a href="/admin-reports.html">資料回報</a><a href="/admin-health.html">系統監控</a><a href="/">回到地圖</a></nav>
<div class="top"><h1>排程資料抓取紀錄</h1><a class="button" href="/admin-health.html">系統監控</a></div>
<div class="filters"><input id="token" type="password" autocomplete="off" placeholder="管理員 Token" aria-label="管理員 Token"><button id="load">載入</button><button id="refresh">重新整理</button><select id="status"><option value="">全部狀態</option><option value="success">成功</option><option value="error">失敗</option><option value="skipped">已跳過</option><option value="running">執行中</option></select><select id="mode"><option value="">全部模式</option><option value="all">全部資料</option><option value="news">新聞與活動</option><option value="traffic">交通與施工</option></select><input id="runId" placeholder="runId 搜尋" aria-label="runId 搜尋"><input id="dateFrom" type="date" aria-label="開始日期"><input id="dateTo" type="date" aria-label="結束日期"><button id="clear">清除篩選</button></div>
<p id="message" class="message" role="status"></p><div class="pager"><button id="prev">上一頁</button><button id="next">下一頁</button><span id="meta" class="meta">目前總筆數 0 筆，第 0／0 頁</span></div>
<table><thead><tr><th>開始／完成時間</th><th>狀態／模式</th><th>執行時間／runId</th><th>RSS</th><th>TDX</th><th>施工</th><th>KKTIX</th><th>AI</th><th>規則式</th><th>最終事件</th><th>定位</th><th>錯誤／跳過原因</th></tr></thead><tbody id="rows"></tbody></table><main id="cards" class="cards"></main>
<script>
const $=id=>document.getElementById(id),pageSize=50;let offset=0,total=0;const statuses={success:'成功',error:'失敗',skipped:'已跳過',running:'執行中'},modes={all:'全部資料',news:'新聞與活動',traffic:'交通與施工'};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function tw(v){const d=new Date(v);return Number.isNaN(d)?'—':new Intl.DateTimeFormat('zh-TW',{timeZone:'Asia/Taipei',dateStyle:'short',timeStyle:'medium',hour12:false}).format(d)}function duration(v){return `${(Number(v||0)/1000).toFixed(1)} 秒`}function values(x){const c=x.sourceCounts||{};return [`${tw(x.startedAt)}\n${tw(x.completedAt)}`,statuses[x.status]||x.status,modes[x.mode]||x.mode, duration(x.durationMs),x.runId||'—',c.rssItems||0,c.tdx||0,c.construction||0,c.activities||0,c.ai||0,c.ruleBased||0,x.count||c.active||0,`${x.geocodingHits||0}／${x.geocodingAttempts||0}`,x.error|| (x.skippedReason==='cron_lock'?'已有排程執行中':'—')]}
function render(logs){$('rows').innerHTML=logs.map(x=>{const v=values(x),cls=x.status==='success'?'ok':x.status==='error'?'bad':x.status==='skipped'?'skip':'';return `<tr><td>${esc(v[0])}</td><td class="${cls}">${esc(v[1])}<br>${esc(v[2])}</td><td>${esc(v[3])}<br>${esc(v[4])}</td>${v.slice(5).map(a=>`<td>${esc(a)}</td>`).join('')}</tr>`}).join('');const names=['開始／完成時間','狀態','模式','執行時間','runId','RSS 數量','TDX 數量','施工數量','KKTIX 活動','AI 事件','規則式事件','最終事件總數','定位成功／嘗試','錯誤／跳過原因'];$('cards').innerHTML=logs.map(x=>{const v=values(x);return `<article class="card"><dl>${v.map((a,i)=>`<dt>${names[i]}</dt><dd>${esc(a)}</dd>`).join('')}</dl></article>`}).join('')}
function updateMeta(){const pages=Math.ceil(total/pageSize);$('meta').textContent=`目前總筆數 ${total} 筆，第 ${pages?Math.floor(offset/pageSize)+1:0}／${pages} 頁`;$('prev').disabled=offset===0;$('next').disabled=offset+pageSize>=total}function headers(){const token=$('token').value.trim();return token?{Authorization:`Bearer ${token}`}:{}}
async function load(reset=false){if(reset)offset=0;const token=$('token').value.trim();if(!token){$('message').textContent='請先輸入管理員 Token。';return}localStorage.report_admin_token=token;const q=new URLSearchParams({limit:pageSize,offset});for(const id of ['status','mode','runId','dateFrom','dateTo'])if($(id).value)q.set(id,$(id).value);$('message').textContent='';try{const r=await fetch('/api/refresh-log?'+q,{headers:headers(),cache:'no-store'}),j=await r.json().catch(()=>({}));if(!r.ok){$('message').textContent=r.status===401?'請先輸入管理員 Token。':r.status===403?'管理員驗證失敗。':'抓取紀錄暫時無法載入。';return}total=Number(j.total)||0;render(Array.isArray(j.logs)?j.logs:[]);if(!total)$('message').textContent='目前沒有抓取紀錄。';updateMeta()}catch{$('message').textContent='抓取紀錄暫時無法載入。'}}
$('token').value=localStorage.report_admin_token||'';$('load').onclick=()=>load(true);$('refresh').onclick=()=>load();$('clear').onclick=()=>{['status','mode','runId','dateFrom','dateTo'].forEach(id=>$(id).value='');load(true)};$('prev').onclick=()=>{offset=Math.max(0,offset-pageSize);load()};$('next').onclick=()=>{if(offset+pageSize<total){offset+=pageSize;load()}};updateMeta();
</script></body></html>
